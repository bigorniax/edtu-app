<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Oficios</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;
    background:radial-gradient(ellipse at 50% 0%,#4a2a10,#1a0e04 60%);color:#ffeedd}
  #menu{position:absolute;inset:0;overflow-y:auto;padding:16px}
  #menu h1{text-align:center;font-size:25px;color:#ffb347;text-shadow:0 0 16px rgba(255,179,71,.45)}
  #menu .sub{text-align:center;color:#c8a884;font-size:13px;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:1000px;margin:0 auto}
  .gbtn{cursor:pointer;border:2px solid rgba(255,179,71,.3);border-radius:14px;padding:13px 9px;text-align:center;
    background:linear-gradient(160deg,rgba(74,42,16,.9),rgba(26,14,4,.9));transition:all .14s}
  .gbtn:hover{transform:translateY(-3px);border-color:#ffb347;box-shadow:0 7px 20px rgba(255,179,71,.24)}
  .gbtn .ico{font-size:28px;display:block;margin-bottom:4px}
  .gbtn .nm{font-weight:800;font-size:13px;color:#fff}
  #play{position:absolute;inset:0;display:none;flex-direction:column}
  #play.on{display:flex}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:rgba(26,14,4,.92);
    border-bottom:1px solid rgba(255,179,71,.25);flex-shrink:0;gap:8px}
  .bar h2{font-size:16px;color:#ffb347;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .info{font-weight:800;font-size:15px;color:#ffd12e;white-space:nowrap}
  .bar button{cursor:pointer;background:rgba(255,91,110,.15);border:1.5px solid rgba(255,91,110,.5);color:#ff8fa0;
    border-radius:9px;padding:6px 11px;font-weight:700;font-size:12px;white-space:nowrap}
  #stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none;border-radius:10px}
  .help{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#c8a884;font-size:12px;pointer-events:none}
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,9,3,.93);text-align:center;padding:20px;z-index:5}
  .win.on{display:flex}
  .win h2{font-size:28px;margin-bottom:8px;color:#ffb347}
  .win p{color:#e8c8a0;font-size:15px;max-width:520px;line-height:1.5}
  .win button{margin-top:16px;cursor:pointer;font-size:17px;font-weight:900;border:none;border-radius:14px;padding:13px 30px;
    color:#2a1404;background:linear-gradient(90deg,#ffb347,#ffd98a)}
</style>
</head>
<body>
<div id="menu">
  <h1>👨‍🍳 Cocina y Oficios</h1>
  <p class="sub">Cocina, construye, cura y atiende · <b>18 juegos</b></p>
  <div class="grid" id="grid"></div>
</div>
<div id="play">
  <div class="bar">
    <h2 id="gname">Juego</h2>
    <span class="info" id="info"></span>
    <button id="back" style="display:none">✕ Menú</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="help" id="help"></div>
    <div class="win" id="win"><h2 id="winTxt">¡Bien!</h2><p id="winSub"></p><button id="again">▶ Otra vez</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
let W=700,H=560;
function tam(w,h){ W=w;H=h;cv.width=w;cv.height=h;fit(); }
function fit(){ const st=$("stage"); const m=Math.min((st.clientWidth-16)/W,(st.clientHeight-16)/H,1.6);
  cv.style.width=(W*m)+"px"; cv.style.height=(H*m)+"px"; }
addEventListener("resize",fit);
function fondo(c){ ctx.fillStyle=c||"#2a1808"; ctx.fillRect(0,0,W,H); }
function texto(t,x,y,s,c,a){ ctx.fillStyle=c||"#fff"; ctx.font="900 "+(s||20)+"px Segoe UI,sans-serif";
  ctx.textAlign=a||"center"; ctx.textBaseline="middle"; ctx.fillText(t,x,y); }
function caja(x,y,w,h,f,b,r){ r=r||8; ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(f){ctx.fillStyle=f;ctx.fill();} if(b){ctx.strokeStyle=b;ctx.lineWidth=2;ctx.stroke();} }
function info(t){ $("info").textContent=t||""; }
function ganar(t,s){ $("winTxt").innerHTML=t; $("winSub").textContent=s||""; $("win").classList.add("on"); }
function anota(n,p){ try{ const k="edtu_oficios_best"; const v=Math.max(parseInt(localStorage.getItem(k)||"0",10)||0,p||1);
  localStorage.setItem(k,String(v));
  if(window.parent&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("Oficios: "+n,p,p); }catch(e){} }

const teclas={}; let raton={x:W/2,y:H/2,abajo:false};
function posEn(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
cv.addEventListener("pointermove",e=>{ const p=posEn(e); raton.x=p.x; raton.y=p.y;
  if(raton.abajo&&juego&&juego.arrastra) juego.arrastra(p.x,p.y); });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); const p=posEn(e); raton.x=p.x; raton.y=p.y; raton.abajo=true;
  if(juego&&juego.clic) juego.clic(p.x,p.y); });
cv.addEventListener("pointerup",()=>{ raton.abajo=false; if(juego&&juego.suelta) juego.suelta(); });
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); teclas[k]=true; if(juego&&juego.tecla) juego.tecla(k);
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault(); });
addEventListener("keyup",e=>{ teclas[e.key.toLowerCase()]=false; });

let juego=null, raf=null;
function abrir(j){ juego=j; $("gname").textContent=j.ico+" "+j.nom; $("help").innerHTML=j.ayuda||"";
  $("menu").style.display="none"; $("play").classList.add("on"); $("win").classList.remove("on");
  info(""); tam(j.w||700,j.h||560); j.init();
  if(raf) cancelAnimationFrame(raf);
  const b=()=>{ raf=requestAnimationFrame(b); if(!$("win").classList.contains("on")) j.paso(); }; b(); }
function cerrar(){ if(raf) cancelAnimationFrame(raf); raf=null; juego=null;
  $("play").classList.remove("on"); $("menu").style.display="block"; }
$("back").onclick=cerrar;
$("again").onclick=()=>{ $("win").classList.remove("on"); info(""); juego.init(); };

const JUEGOS=[];
const add=(o)=>JUEGOS.push(o);

/* ===================== 18 DE OFICIOS ===================== */

// 1) PIZZERO
let pz;
add({ico:"🍕",nom:"Pizzero",ayuda:"Pon los ingredientes que pide el cliente",
 init:()=>{ const I=[["🍅","tomate"],["🧀","queso"],["🍄","champiñón"],["🫒","aceituna"],
   ["🌶️","ají"],["🥓","tocino"]];
   pz={I,pedido:[],puesto:[],ok:0,mal:0}; nuevoPedido(); },
 paso:()=>{ const g=pz; fondo("#3a2008");
   texto("Pedido: "+g.pedido.map(i=>i[0]).join(" "),W/2,52,30,"#ffd12e");
   // masa
   ctx.fillStyle="#e8c070"; ctx.beginPath(); ctx.arc(W/2,250,130,0,7); ctx.fill();
   ctx.fillStyle="#d04a2a"; ctx.beginPath(); ctx.arc(W/2,250,112,0,7); ctx.fill();
   g.puesto.forEach((i,k)=>{ const a=k/Math.max(1,g.puesto.length)*7;
     texto(i[0],W/2+Math.cos(a)*62,250+Math.sin(a)*62,34); });
   g.I.forEach((i,k)=>{ const x=W/2+((k%3)-1)*160, y=H-150+(k<3?0:84);
     caja(x-62,y-34,124,68,"rgba(255,179,71,.14)","#ffb347",12);
     texto(i[0]+" "+i[1],x,y,17); });
   info("✅"+g.ok+"  ❌"+g.mal);
 },
 clic:(x,y)=>{ const g=pz; if(y<H-190) return;
   for(let k=0;k<6;k++){ const cx=W/2+((k%3)-1)*160, cy=H-150+(k<3?0:84);
     if(Math.abs(x-cx)<62&&Math.abs(y-cy)<34){
       const i=g.I[k], n=g.puesto.length;
       if(g.pedido[n] && g.pedido[n][1]===i[1]){ g.puesto.push(i);
         if(g.puesto.length===g.pedido.length){ g.ok++;
           if(g.ok>=6){ anota("Pizzero",g.ok); ganar("🏆 ¡PIZZERO EXPERTO!",g.ok+" pizzas"); return; }
           nuevoPedido(); } }
       else { g.mal++; g.puesto=[];
         if(g.mal>=4){ anota("Pizzero",g.ok); ganar("🍕 Se quemaron",g.ok+" pizzas"); } }
       return; } } }});
function nuevoPedido(){ const g=pz, n=2+Math.floor(Math.random()*3);
  g.pedido=[]; g.puesto=[];
  for(let i=0;i<n;i++) g.pedido.push(g.I[(Math.random()*6)|0]); }

// 2) MESERO
let ms;
add({ico:"🍽️",nom:"Mesero",ayuda:"Lleva cada plato a su mesa antes que se enfríe",
 init:()=>{ ms={mesas:[],plato:null,x:W/2,y:H-70,t:0,servidos:0,perdidos:0};
   for(let i=0;i<4;i++) ms.mesas.push({x:120+i*((W-240)/3),y:150,pide:null,t:0}); },
 paso:()=>{ const g=ms; fondo("#4a2e12"); g.t++;
   const C=["🍕","🍔","🍜","🥗"];
   if(g.t%110===0){ const libres=g.mesas.filter(m=>!m.pide);
     if(libres.length) { const m=libres[(Math.random()*libres.length)|0];
       m.pide=C[(Math.random()*4)|0]; m.t=420; } }
   g.mesas.forEach(m=>{ caja(m.x-58,m.y-38,116,76,"#8a5a2a","#5a3a18",10);
     texto("🧑",m.x,m.y-62,32);
     if(m.pide){ m.t--;
       texto(m.pide,m.x,m.y,30);
       caja(m.x-44,m.y+48,88,10,"#333",null,5);
       caja(m.x-44,m.y+48,88*Math.max(0,m.t)/420,10, m.t>140?"#39ff14":"#ff5b6e",null,5);
       if(m.t<=0){ m.pide=null; g.perdidos++;
         if(g.perdidos>=4){ anota("Mesero",g.servidos); ganar("😤 Se fueron enojados",g.servidos+" servidos"); } } } });
   // cocina
   caja(40,H-170,W-80,70,"rgba(255,179,71,.12)","#ffb347",12);
   C.forEach((c,i)=>{ const x=100+i*((W-200)/3); texto(c,x,H-135,34); });
   texto("COCINA (toca un plato)",W/2,H-182,16,"#c8a884");
   g.x+=(raton.x-g.x)*0.22;
   texto("🧑‍🍳",g.x,H-62,40);
   if(g.plato) texto(g.plato,g.x,H-96,26);
   info("🍽️ "+g.servidos+"  😤"+g.perdidos+"/4");
   if(g.servidos>=12){ anota("Mesero",g.servidos); ganar("🏆 ¡MESERO ESTRELLA!",""); }
 },
 clic:(x,y)=>{ const g=ms, C=["🍕","🍔","🍜","🥗"];
   if(y>H-170&&y<H-100){ for(let i=0;i<4;i++){ const cx=100+i*((W-200)/3);
     if(Math.abs(x-cx)<48) g.plato=C[i]; } return; }
   if(!g.plato) return;
   const m=g.mesas.find(m2=>Math.abs(m2.x-x)<64&&Math.abs(m2.y-y)<80);
   if(m&&m.pide===g.plato){ m.pide=null; g.plato=null; g.servidos++; } }});

// 3) CONSTRUCTOR
let cn;
add({ico:"🧱",nom:"Constructor",ayuda:"Apila los ladrillos sin que se caiga la torre",
 init:()=>{ cn={bl:[],x:W/2,dir:3,y:H-60,cayendo:false,altura:0,ancho:180,t:0};
   cn.bl.push({x:W/2-90,y:H-60,w:180}); },
 paso:()=>{ const g=cn; fondo("#6a8ab0"); g.t++;
   ctx.fillStyle="#5aa02a"; ctx.fillRect(0,H-30,W,30);
   const desp=Math.max(0,g.bl.length*34-(H-200));
   g.bl.forEach((b,i)=>{ caja(b.x,b.y+desp,b.w,32,"#c0542a","#8a3a18",4);
     for(let k=0;k<3;k++){ ctx.strokeStyle="rgba(0,0,0,.2)"; ctx.lineWidth=1;
       ctx.beginPath(); ctx.moveTo(b.x+b.w*(k+1)/4,b.y+desp); ctx.lineTo(b.x+b.w*(k+1)/4,b.y+desp+32); ctx.stroke(); } });
   if(!g.cayendo){ g.x+=g.dir*(3+g.altura*0.14);
     if(g.x<40||g.x+g.ancho>W-40) g.dir*=-1;
     caja(g.x,80,g.ancho,32,"#ffd12e","#c8a020",4); }
   texto("toca para soltar",W/2,46,20,"#1a3a5a");
   info("🧱 piso "+g.altura);
 },
 clic:()=>{ const g=cn; if(g.cayendo) return;
   const ult=g.bl[g.bl.length-1];
   const izq=Math.max(g.x,ult.x), der=Math.min(g.x+g.ancho,ult.x+ult.w);
   const sol=der-izq;
   if(sol<=6){ anota("Constructor",g.altura); ganar("🧱 ¡Se cayó!","llegaste al piso "+g.altura); return; }
   g.ancho=sol; g.bl.push({x:izq,y:ult.y-34,w:sol}); g.altura++;
   if(g.altura>=15){ anota("Constructor",g.altura); ganar("🏆 ¡RASCACIELOS!",g.altura+" pisos"); } }});

// 4) DOCTOR
let dr;
add({ico:"🩺",nom:"Doctor",ayuda:"Elige lo que necesita cada paciente",
 init:()=>{ const P=[["🤒 Fiebre","🌡️"],["🦴 Hueso roto","🩹"],["😷 Tos","💊"],
   ["🩸 Herida","🩹"],["🦷 Muela","🦷"],["👁️ No ve bien","👓"],
   ["🤧 Alergia","💊"],["🦵 Esguince","🩹"]];
   dr={P,cola:P.slice().sort(()=>Math.random()-0.5),ok:0,mal:0,
     H:["🌡️","🩹","💊","🦷","👓"]}; },
 paso:()=>{ const g=dr; fondo("#e8f4f8");
   const act=g.cola[0];
   if(!act){ anota("Doctor",g.ok); ganar("🏆 ¡TODOS CURADOS!",g.ok+" pacientes"); return; }
   texto("👨‍⚕️ Consulta",W/2,48,26,"#1a5a7a");
   caja(W/2-200,90,400,110,"#fff","#8ab4c8",16);
   texto(act[0],W/2,145,30,"#1a3a4a");
   texto("¿Qué le doy?",W/2,245,22,"#1a5a7a");
   g.H.forEach((h,i)=>{ const x=W/2+(i-2)*130;
     caja(x-54,H-180,108,108,"#fff","#2fd0ff",16); texto(h,x,H-126,46); });
   info("✅"+g.ok+"  ❌"+g.mal);
 },
 clic:(x,y)=>{ const g=dr, act=g.cola[0]; if(!act) return;
   if(y<H-180||y>H-72) return;
   for(let i=0;i<5;i++){ const cx=W/2+(i-2)*130;
     if(Math.abs(x-cx)<54){ if(g.H[i]===act[1]) g.ok++; else g.mal++;
       g.cola.shift(); return; } } }});

// 5) CAJERO
let cj;
add({ico:"💰",nom:"Cajero",ayuda:"Da el vuelto exacto",
 init:()=>{ cj={precio:0,pago:0,dado:0,M:[100,500,1000,5000],ok:0,mal:0}; nuevaCompra(); },
 paso:()=>{ const g=cj; fondo("#2a3a1a");
   const vuelto=g.pago-g.precio;
   texto("Cuesta $"+g.precio.toLocaleString("es"),W/2,56,26,"#ffd12e");
   texto("Pagó con $"+g.pago.toLocaleString("es"),W/2,100,24,"#c8e8a0");
   texto("Vuelto: $"+vuelto.toLocaleString("es"),W/2,160,30,"#fff");
   texto("Llevas: $"+g.dado.toLocaleString("es"),W/2,210,26,
     g.dado===vuelto?"#39ff14":g.dado>vuelto?"#ff5b6e":"#ffd12e");
   g.M.forEach((m,i)=>{ const x=W/2+(i-1.5)*165;
     caja(x-74,H-180,148,92,"rgba(255,209,46,.16)","#ffd12e",12);
     texto("$"+m.toLocaleString("es"),x,H-134,22); });
   caja(W/2-80,H-72,160,46,"rgba(255,91,110,.16)","#ff5b6e",12);
   texto("🗑 empezar",W/2,H-49,18);
   info("✅"+g.ok+"  ❌"+g.mal);
   if(g.dado===vuelto && vuelto>0){ g.ok++;
     if(g.ok>=5){ anota("Cajero",g.ok); ganar("🏆 ¡CUENTAS PERFECTAS!",""); }
     else nuevaCompra(); }
   if(g.dado>vuelto){ g.mal++; g.dado=0;
     if(g.mal>=4){ anota("Cajero",g.ok); ganar("💸 Diste de más",g.ok+" vueltos"); } }
 },
 clic:(x,y)=>{ const g=cj;
   if(y>H-76&&Math.abs(x-W/2)<80){ g.dado=0; return; }
   if(y<H-180||y>H-88) return;
   g.M.forEach((m,i)=>{ const cx=W/2+(i-1.5)*165;
     if(Math.abs(x-cx)<74) g.dado+=m; }); }});
function nuevaCompra(){ const g=cj;
  g.precio=Math.round((300+Math.random()*4000)/100)*100;
  const opc=[1000,2000,5000,10000].filter(v=>v>g.precio);
  g.pago=opc[0]||10000; g.dado=0; }

// 6) BOMBERO
let bo;
add({ico:"🚒",nom:"Bombero",ayuda:"Apaga todos los fuegos con el chorro",
 init:()=>{ bo={f:[],t:0,apagados:0,agua:100};
   for(let i=0;i<7;i++) bo.f.push({x:70+Math.random()*(W-140),y:110+Math.random()*(H-300),v:100}); },
 paso:()=>{ const g=bo; fondo("#2a1a10"); g.t++;
   // edificio
   caja(60,90,W-120,H-230,"#4a3a2a","#2a1a10",10);
   for(let r=0;r<4;r++) for(let c=0;c<6;c++)
     caja(100+c*((W-240)/5),130+r*((H-320)/3),52,42,"rgba(120,160,200,.25)",null,4);
   g.f.forEach(f=>{ if(f.v<=0) return;
     const s=22+Math.sin(g.t*0.3+f.x)*5;
     texto("🔥",f.x,f.y,s+f.v*0.18);
     caja(f.x-26,f.y+28,52,7,"#333",null,4);
     caja(f.x-26,f.y+28,52*f.v/100,7,"#ff5b6e",null,4); });
   // chorro
   const bx=W/2, by=H-70;
   texto("🚒",bx,by,46);
   const echando = raton.abajo && g.agua>0;
   if(echando){ g.agua-=0.5;
     ctx.strokeStyle="rgba(100,200,255,.7)"; ctx.lineWidth=11; ctx.lineCap="round";
     ctx.beginPath(); ctx.moveTo(bx,by-24); ctx.lineTo(raton.x,raton.y); ctx.stroke();
     g.f.forEach(f=>{ if(f.v>0 && Math.hypot(f.x-raton.x,f.y-raton.y)<48){ f.v-=2.2;
       if(f.v<=0){ g.apagados++; } } }); }
   if(!echando && g.agua<100) g.agua+=0.25;
   caja(40,H-34,W-80,16,"rgba(0,0,0,.4)",null,8);
   caja(40,H-34,(W-80)*g.agua/100,16,"#2fd0ff",null,8);
   info("🔥 "+(7-g.apagados)+" · 💧 "+Math.round(g.agua)+"%");
   if(g.apagados>=7){ anota("Bombero",Math.max(1,3000-g.t)); ganar("🏆 ¡FUEGO APAGADO!","en "+(g.t/60).toFixed(1)+"s"); }
 }});

// 7) PELUQUERO
let pq;
add({ico:"✂️",nom:"Peluquero",ayuda:"Corta hasta la línea · ni más ni menos",
 init:()=>{ pq={pelos:[],meta:0,ok:0,t:0}; nuevoCorte(); },
 paso:()=>{ const g=pq; fondo("#f0d8e8"); g.t++;
   // cabeza
   ctx.fillStyle="#f0c8a0"; ctx.beginPath(); ctx.arc(W/2,H-130,110,0,7); ctx.fill();
   texto("😊",W/2,H-120,56);
   const base=H-220;
   g.pelos.forEach((p,i)=>{ const x=W/2-150+i*(300/g.pelos.length);
     ctx.strokeStyle="#5a3a18"; ctx.lineWidth=7; ctx.lineCap="round";
     ctx.beginPath(); ctx.moveTo(x,base); ctx.lineTo(x,base-p); ctx.stroke(); });
   // linea objetivo
   ctx.strokeStyle="#ff5b6e"; ctx.lineWidth=3; ctx.setLineDash([9,7]);
   ctx.beginPath(); ctx.moveTo(60,base-g.meta); ctx.lineTo(W-60,base-g.meta); ctx.stroke(); ctx.setLineDash([]);
   texto("corta hasta la línea roja",W/2,60,22,"#8a4a6a");
   texto("✂️",raton.x,raton.y,34);
   const dif=g.pelos.reduce((a,p)=>a+Math.abs(p-g.meta),0)/g.pelos.length;

    ["JUGADOR B","#2fd0ff",g.b,g.tb,0.75,"tecla L"]].forEach(([n,c,hechas,prog,fx,tk])=>{
     const x=W*fx;
     texto(n,x,50,24,c);
     texto(H2[Math.min(4,hechas)],x,150,66);
     caja(x-110,230,220,30,"rgba(0,0,0,.4)",null,15);
     caja(x-110,230,220*prog/g.meta,30,c,null,15);
     texto(hechas+"/"+g.obj+" tareas",x,300,22,c);
     for(let i=0;i<g.obj;i++){ ctx.fillStyle=i<hechas?c:"rgba(255,255,255,.15)";
       ctx.beginPath(); ctx.arc(x-80+i*40,350,13,0,7); ctx.fill(); }
     texto(tk,x,H-60,20,c);
     texto("apreta rápido",x,H-28,16,"#c8a884"); });
   info("🏁 "+g.a+" - "+g.b);
   if(g.a>=g.obj){ anota("Duelo",g.a); ganar("🏆 ¡GANA EL JUGADOR A!",""); }
   if(g.b>=g.obj){ anota("Duelo",g.b); ganar("🏆 ¡GANA EL JUGADOR B!",""); }
 },
 clic:(x)=>{ if(x<W/2) avanzaDuelo("a"); else avanzaDuelo("b"); },
 tecla:(k)=>{ if(k==="a") avanzaDuelo("a"); if(k==="l") avanzaDuelo("b"); }});
function avanzaDuelo(q){ const g=co;
  if(q==="a"){ g.ta++; if(g.ta>=g.meta){ g.ta=0; g.a++; } }
  else { g.tb++; if(g.tb>=g.meta){ g.tb=0; g.b++; } } }

/* ---------- menú ---------- */
$("grid").innerHTML = JUEGOS.map((j,i)=>
  '<div class="gbtn" data-i="'+i+'"><span class="ico">'+j.ico+'</span><span class="nm">'+j.nom+'</span></div>').join("");
document.querySelectorAll(".gbtn").forEach(b=> b.onclick=()=>abrir(JUEGOS[+b.dataset.i]));
fit();

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});

/* 🔙 UN SOLO BOTÓN DE SALIR: EDTU nos avisa y decidimos aquí.
   Si hay un juego abierto, volvemos al menú del paquete; si ya estamos
   en el menú, le decimos a EDTU que cierre el marco. */
addEventListener("message",function(e){
  var d=e.data||{};
  if(d.edtuSalir){
    if($("play").classList.contains("on")){ cerrar(); }
    else { try{ parent.postMessage({edtuCerrarMundo:1},"*"); }catch(x){} }
  }
});
/* le avisamos a EDTU que este paquete sabe manejar el botón */
try{ parent.postMessage({edtuPackListo:1},"*"); }catch(x){}

</script>
