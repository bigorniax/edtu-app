<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Música</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;
    background:radial-gradient(ellipse at 50% 0%,#2a1040,#0a0418 60%);color:#efe8ff}
  #menu{position:absolute;inset:0;overflow-y:auto;padding:16px}
  #menu h1{text-align:center;font-size:25px;color:#c58cff;text-shadow:0 0 16px rgba(197,140,255,.5)}
  #menu .sub{text-align:center;color:#a894c4;font-size:13px;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:1000px;margin:0 auto}
  .gbtn{cursor:pointer;border:2px solid rgba(197,140,255,.3);border-radius:14px;padding:13px 9px;text-align:center;
    background:linear-gradient(160deg,rgba(48,20,74,.9),rgba(14,6,26,.9));transition:all .14s}
  .gbtn:hover{transform:translateY(-3px);border-color:#c58cff;box-shadow:0 7px 20px rgba(197,140,255,.25)}
  .gbtn .ico{font-size:28px;display:block;margin-bottom:4px}
  .gbtn .nm{font-weight:800;font-size:13px;color:#fff}
  #play{position:absolute;inset:0;display:none;flex-direction:column}
  #play.on{display:flex}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:rgba(10,4,24,.92);
    border-bottom:1px solid rgba(197,140,255,.25);flex-shrink:0;gap:8px}
  .bar h2{font-size:16px;color:#c58cff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .info{font-weight:800;font-size:15px;color:#ffd12e;white-space:nowrap}
  .bar button{cursor:pointer;background:rgba(255,91,110,.15);border:1.5px solid rgba(255,91,110,.5);color:#ff8fa0;
    border-radius:9px;padding:6px 11px;font-weight:700;font-size:12px;white-space:nowrap}
  #stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none;border-radius:10px}
  .help{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#a894c4;font-size:12px;pointer-events:none}
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,3,18,.93);text-align:center;padding:20px;z-index:5}
  .win.on{display:flex}
  .win h2{font-size:28px;margin-bottom:8px;color:#c58cff}
  .win button{margin-top:16px;cursor:pointer;font-size:17px;font-weight:900;border:none;border-radius:14px;padding:13px 30px;
    color:#1a0828;background:linear-gradient(90deg,#c58cff,#ff8fd0)}
</style>
</head>
<body>
<div id="menu">
  <h1>🎵 Música y Ritmo</h1>
  <p class="sub">Toca, canta y sigue el compás · <b>18 juegos</b></p>
  <div class="grid" id="grid"></div>
</div>
<div id="play">
  <div class="bar">
    <h2 id="gname">Juego</h2>
    <span class="info" id="info"></span>
    <button id="back">✕ Menú</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="help" id="help"></div>
    <div class="win" id="win"><h2 id="winTxt">¡Bien!</h2><p id="winSub"></p><button id="again">▶ Otra vez</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
let W=700,H=560;
function tam(w,h){ W=w;H=h;cv.width=w;cv.height=h;fit(); }
function fit(){ const st=$("stage"); const m=Math.min((st.clientWidth-16)/W,(st.clientHeight-16)/H,1.6);
  cv.style.width=(W*m)+"px"; cv.style.height=(H*m)+"px"; }
addEventListener("resize",fit);
function fondo(c){ ctx.fillStyle=c||"#12061f"; ctx.fillRect(0,0,W,H); }
function texto(t,x,y,s,c,a){ ctx.fillStyle=c||"#fff"; ctx.font="900 "+(s||20)+"px Segoe UI,sans-serif";
  ctx.textAlign=a||"center"; ctx.textBaseline="middle"; ctx.fillText(t,x,y); }
function caja(x,y,w,h,f,b,r){ r=r||8; ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(f){ctx.fillStyle=f;ctx.fill();} if(b){ctx.strokeStyle=b;ctx.lineWidth=2;ctx.stroke();} }
function info(t){ $("info").textContent=t||""; }
function ganar(t,s){ $("winTxt").innerHTML=t; $("winSub").textContent=s||""; $("win").classList.add("on"); }
function anota(n,p){ try{ const k="edtu_musica_best"; const v=Math.max(parseInt(localStorage.getItem(k)||"0",10)||0,p||1);
  localStorage.setItem(k,String(v));
  if(window.parent&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("Música: "+n,p,p); }catch(e){} }

/* 🔊 sonido de verdad: notas con Web Audio (sin archivos de fuera) */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; } }
// nota por número MIDI: 60 = do central
function nota(midi,dur,tipo,vol){ const a=ac(); if(!a) return;
  try{ const o=a.createOscillator(), g=a.createGain();
    o.type=tipo||"triangle"; o.frequency.value=440*Math.pow(2,(midi-69)/12);
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol||0.22,a.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(dur||0.3));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.3)+0.05);
  }catch(e){} }
function ruido(dur,vol){ const a=ac(); if(!a) return;
  try{ const n=Math.floor(a.sampleRate*(dur||0.12));
    const b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(), g=a.createGain();
    s.buffer=b; g.gain.value=vol||0.2; s.connect(g); g.connect(a.destination); s.start();
  }catch(e){} }
const ESCALA=[60,62,64,65,67,69,71,72];          // do re mi fa sol la si do
const NOMBRES=["DO","RE","MI","FA","SOL","LA","SI","DO"];
const COLORES=["#ff5b6e","#ff9a3c","#ffd12e","#39ff14","#2fd0ff","#5b7bff","#c58cff","#ff6ad5"];

const teclas={}; let raton={x:W/2,y:H/2,abajo:false};
function posEn(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
cv.addEventListener("pointermove",e=>{ const p=posEn(e); raton.x=p.x; raton.y=p.y;
  if(raton.abajo && juego && juego.arrastra) juego.arrastra(p.x,p.y); });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); const p=posEn(e);
  raton.x=p.x; raton.y=p.y; raton.abajo=true; if(juego&&juego.clic) juego.clic(p.x,p.y); });
cv.addEventListener("pointerup",()=>{ raton.abajo=false; if(juego&&juego.suelta) juego.suelta(); });
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); if(teclas[k]) return; teclas[k]=true; ac();
  if(juego&&juego.tecla) juego.tecla(k);
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault(); });
addEventListener("keyup",e=>{ teclas[e.key.toLowerCase()]=false; });

let juego=null, raf=null;
function abrir(j){ juego=j; $("gname").textContent=j.ico+" "+j.nom; $("help").innerHTML=j.ayuda||"";
  $("menu").style.display="none"; $("play").classList.add("on"); $("win").classList.remove("on");
  info(""); tam(j.w||700,j.h||560); j.init();
  if(raf) cancelAnimationFrame(raf);
  const b=()=>{ raf=requestAnimationFrame(b); if(!$("win").classList.contains("on")) j.paso(); }; b(); }
function cerrar(){ if(raf) cancelAnimationFrame(raf); raf=null; juego=null;
  $("play").classList.remove("on"); $("menu").style.display="block"; }
$("back").onclick=cerrar;
$("again").onclick=()=>{ $("win").classList.remove("on"); info(""); juego.init(); };

const JUEGOS=[];
const add=(o)=>JUEGOS.push(o);

/* ===================== 18 DE MÚSICA ===================== */

// 1) PIANO LIBRE
let pi;
add({ico:"🎹",nom:"Piano",ayuda:"Toca las teclas · filas A S D F G H J K",
 init:()=>{ pi={brillo:Array(8).fill(0),notas:0}; },
 paso:()=>{ const g=pi; fondo("#1a0a28");
   const an=W/8;
   for(let i=0;i<8;i++){ const x=i*an;
     const b=g.brillo[i]; if(g.brillo[i]>0) g.brillo[i]-=0.05;
     caja(x+4,100,an-8,H-140, b>0?COLORES[i]:"#f4f0ff", "#7a5a9a", 10);
     texto(NOMBRES[i],x+an/2,H-90,20,"#4a2a6a");
     texto("ASDFGHJK"[i],x+an/2,H-60,16,"#9a7aba"); }
   texto("🎹 toca con el mouse o el teclado",W/2,50,22,"#c58cff");
   info("♪ "+g.notas);
 },
 clic:(x,y)=>{ if(y<100) return; const i=Math.floor(x/(W/8));
   if(i>=0&&i<8){ nota(ESCALA[i],0.6,"triangle"); pi.brillo[i]=1; pi.notas++; } },
 tecla:(k)=>{ const i="asdfghjk".indexOf(k);
   if(i>=0){ nota(ESCALA[i],0.6,"triangle"); pi.brillo[i]=1; pi.notas++; } }});

// 2) REPITE LA MELODÍA (Simón)
let si;
add({ico:"🧠",nom:"Repite",ayuda:"Escucha la melodía y repítela",
 init:()=>{ si={sec:[],tu:0,mostrando:true,i:0,t:0,brillo:-1,ronda:0};
   si.sec.push((Math.random()*4)|0); },
 paso:()=>{ const g=si; fondo("#140a22"); g.t++;
   const R=110;
   for(let i=0;i<4;i++){ const a=i*Math.PI/2+Math.PI/4;
     const x=W/2+Math.cos(a)*150, y=H/2+Math.sin(a)*150;
     ctx.globalAlpha=g.brillo===i?1:0.45;
     ctx.fillStyle=COLORES[i*2]; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
     ctx.globalAlpha=1; }
   if(g.mostrando){ texto("ESCUCHA…",W/2,46,26,"#c58cff");
     if(g.t%48===0){ const k=g.t/48-1;
       if(k<g.sec.length){ g.brillo=g.sec[k]; nota(ESCALA[g.sec[k]*2],0.45,"sine"); }
       else if(k===g.sec.length){ g.brillo=-1; }
       else { g.mostrando=false; g.tu=0; g.t=0; } }
     if(g.t%48===30) g.brillo=-1; }
   else texto("¡TU TURNO! "+g.tu+"/"+g.sec.length,W/2,46,26,"#39ff14");
   info("ronda "+(g.ronda+1));
 },
 clic:(x,y)=>{ const g=si; if(g.mostrando) return;
   for(let i=0;i<4;i++){ const a=i*Math.PI/2+Math.PI/4;
     const cx=W/2+Math.cos(a)*150, cy=H/2+Math.sin(a)*150;
     if(Math.hypot(cx-x,cy-y)<110){ nota(ESCALA[i*2],0.4,"sine"); g.brillo=i;
       setTimeout(()=>{ if(si===g) g.brillo=-1; },180);
       if(i===g.sec[g.tu]){ g.tu++;
         if(g.tu>=g.sec.length){ g.ronda++;
           if(g.ronda>=10){ anota("Repite",g.ronda); ganar("🏆 ¡MEMORIA DE ORO!",g.ronda+" rondas"); return; }
           g.sec.push((Math.random()*4)|0); g.mostrando=true; g.t=0; } }
       else { ruido(0.3,0.3); anota("Repite",g.ronda); ganar("❌ Esa no era",g.ronda+" rondas"); }
       return; } } }});

// 3) GUITARRA HÉROE
let gh;
add({ico:"🎸",nom:"Guitarra",ayuda:"Toca cuando la nota llegue a la línea · D F J K",
 init:()=>{ gh={n:[],t:0,pts:0,fallos:0,brillo:[0,0,0,0]}; },
 paso:()=>{ const g=gh; fondo("#0a0612"); g.t++;
   const an=W/4, LIN=H-110;
   for(let i=0;i<4;i++){ ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=2;
     ctx.beginPath(); ctx.moveTo(an*i+an/2,0); ctx.lineTo(an*i+an/2,H); ctx.stroke();
     const b=g.brillo[i]; if(g.brillo[i]>0) g.brillo[i]-=0.08;
     caja(an*i+12,LIN-26,an-24,52, b>0?COLORES[i*2]:"rgba(255,255,255,.08)", COLORES[i*2], 12);
     texto("DFJK"[i],an*i+an/2,LIN,22,b>0?"#000":"#fff"); }
   if(g.t%34===0) g.n.push({c:(Math.random()*4)|0,y:-30});
   for(let i=g.n.length-1;i>=0;i--){ const n=g.n[i]; n.y+=5.2;
     ctx.fillStyle=COLORES[n.c*2]; ctx.beginPath();
     ctx.arc(an*n.c+an/2,n.y,22,0,7); ctx.fill();
     if(n.y>LIN+50){ g.n.splice(i,1); g.fallos++;
       if(g.fallos>=8){ anota("Guitarra",g.pts); ganar("🎸 Se te fue el ritmo",g.pts+" puntos"); return; } } }
   info("⭐"+g.pts+"  ❌"+g.fallos+"/8");
   if(g.pts>=600){ anota("Guitarra",g.pts); ganar("🏆 ¡ROCKSTAR!",g.pts+" puntos"); }
 },
 clic:(x,y)=>{ const i=Math.floor(x/(W/4)); if(i>=0&&i<4) rasga(i); },
 tecla:(k)=>{ const i="dfjk".indexOf(k); if(i>=0) rasga(i); }});
function rasga(i){ const g=gh, LIN=H-110; g.brillo[i]=1;
  const j=g.n.findIndex(n=>n.c===i && Math.abs(n.y-LIN)<42);
  if(j>=0){ const d=Math.abs(g.n[j].y-LIN);
    g.pts+= d<14?20:d<28?10:5; nota(ESCALA[i*2],0.25,"sawtooth",0.16); g.n.splice(j,1); }
  else { ruido(0.08,0.1); g.pts=Math.max(0,g.pts-5); } }

// 4) BATERÍA
let ba;
add({ico:"🥁",nom:"Batería",ayuda:"Golpea los platos y tambores",
 init:()=>{ ba={p:[{x:W*0.2,y:H*0.35,r:70,n:"CHARLES",t:"hat"},
   {x:W*0.5,y:H*0.3,r:85,n:"CRASH",t:"crash"},{x:W*0.8,y:H*0.35,r:70,n:"RIDE",t:"hat"},
   {x:W*0.3,y:H*0.68,r:80,n:"CAJA",t:"caja"},{x:W*0.7,y:H*0.68,r:80,n:"TOM",t:"tom"},
   {x:W*0.5,y:H*0.82,r:95,n:"BOMBO",t:"bombo"}], golpes:0, b:[0,0,0,0,0,0]}; },
 paso:()=>{ const g=ba; fondo("#1a0c08");
   g.p.forEach((p,i)=>{ const b=g.b[i]; if(g.b[i]>0) g.b[i]-=0.08;
     ctx.fillStyle=b>0?"#ffd12e":(p.t==="bombo"?"#8a4a2a":p.t==="caja"?"#c8c8d8":"#c8a040");
     ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+b*0.07),0,7); ctx.fill();
     ctx.strokeStyle="#5a3018"; ctx.lineWidth=4; ctx.stroke();
     texto(p.n,p.x,p.y,15,"#3a1a08"); });
   info("🥁 "+g.golpes);
 },
 clic:(x,y)=>{ const g=ba;
   g.p.forEach((p,i)=>{ if(Math.hypot(p.x-x,p.y-y)<p.r){ g.b[i]=1; g.golpes++;
     if(p.t==="bombo") nota(45,0.22,"sine",0.4);
     else if(p.t==="tom") nota(55,0.2,"sine",0.3);
     else if(p.t==="caja"){ ruido(0.14,0.25); nota(62,0.08,"square",0.08); }
     else if(p.t==="crash") ruido(0.5,0.18);
     else ruido(0.07,0.14); } }); }});

// 5) ADIVINA LA NOTA
let an;
add({ico:"👂",nom:"Oído",ayuda:"Escucha y di qué nota es",
 init:()=>{ an={nota:(Math.random()*8)|0,aciertos:0,fallos:0,sono:false}; },
 paso:()=>{ const g=an; fondo("#140a22");
   if(!g.sono){ nota(ESCALA[g.nota],0.8,"sine"); g.sono=true; }
   texto("🔊 ¿Qué nota sonó?",W/2,70,26,"#c58cff");
   caja(W/2-80,110,160,56,"rgba(197,140,255,.2)","#c58cff",12);
   texto("▶ oír otra vez",W/2,138,18);
   for(let i=0;i<8;i++){ const x=W/2+((i%4)-1.5)*150, y=H/2+(i<4?0:110);
     caja(x-66,y-40,132,80,"rgba(255,255,255,.08)",COLORES[i],12);
     texto(NOMBRES[i],x,y,24,COLORES[i]); }
   info("✅"+g.aciertos+"  ❌"+g.fallos+"/5");
 },
 clic:(x,y)=>{ const g=an;
   if(y>110&&y<166&&Math.abs(x-W/2)<80){ nota(ESCALA[g.nota],0.8,"sine"); return; }
   for(let i=0;i<8;i++){ const cx=W/2+((i%4)-1.5)*150, cy=H/2+(i<4?0:110);
     if(Math.abs(x-cx)<66&&Math.abs(y-cy)<40){
       if(i===g.nota){ g.aciertos++; nota(ESCALA[i],0.3,"triangle");
         if(g.aciertos>=10){ anota("Oído",g.aciertos); ganar("🏆 ¡OÍDO ABSOLUTO!",""); return; }
         g.nota=(Math.random()*8)|0; g.sono=false; }
       else { g.fallos++; ruido(0.2,0.2);
         if(g.fallos>=5){ anota("Oído",g.aciertos); ganar("👂 A entrenar el oído",g.aciertos+" aciertos"); } }
       return; } } }});

// 6) METRÓNOMO
let me;
add({ico:"⏱️",nom:"Metrónomo",ayuda:"Toca justo en cada pulso",
 init:()=>{ me={t:0,per:60,pts:0,fallos:0,ult:-99,ang:0}; },
 paso:()=>{ const g=me; fondo("#0e0818"); g.t++;
   if(g.t%g.per===0){ nota(84,0.08,"square",0.14);
     if(g.t-g.ult>g.per*0.9 && g.t>g.per){ g.fallos++;
       if(g.fallos>=5){ anota("Metrónomo",g.pts); ganar("⏱️ Perdiste el pulso",g.pts+" puntos"); return; } } }
   const f=(g.t%g.per)/g.per;
   g.ang=Math.sin(f*Math.PI*2)*0.5;
   ctx.save(); ctx.translate(W/2,H-110); ctx.rotate(g.ang);
   ctx.strokeStyle="#c58cff"; ctx.lineWidth=10; ctx.lineCap="round";
   ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-230); ctx.stroke();
   ctx.fillStyle="#ffd12e"; ctx.beginPath(); ctx.arc(0,-190,20,0,7); ctx.fill(); ctx.restore();
   const cerca=Math.min(f,1-f);
   ctx.globalAlpha=1-cerca*5; ctx.fillStyle="#39ff14";
   ctx.beginPath(); ctx.arc(W/2,80,46,0,7); ctx.fill(); ctx.globalAlpha=1;
   texto("TOCA EN EL PULSO",W/2,H-40,20,"#a894c4");
   info("⭐"+g.pts+"  ❌"+g.fallos+"/5  "+Math.round(3600/g.per)+" bpm");
   if(g.pts>=400){ anota("Metrónomo",g.pts); ganar("🏆 ¡RELOJ HUMANO!",""); }
 },
 clic:()=>{ const g=me; const f=(g.t%g.per)/g.per, d=Math.min(f,1-f)*g.per;
   g.ult=g.t;
   if(d<4){ g.pts+=20; nota(72,0.12,"triangle",0.18); if(g.pts%100===0) g.per=Math.max(26,g.per-6); }
   else if(d<8){ g.pts+=8; nota(67,0.1,"triangle",0.14); }
   else { g.fallos++; ruido(0.1,0.15);
     if(g.fallos>=5){ anota("Metrónomo",g.pts); ganar("⏱️ Perdiste el pulso",g.pts+" puntos"); } } }});

// 7) KARAOKE (sigue la línea con el mouse)
let ka;
add({ico:"🎤",nom:"Karaoke",ayuda:"Mueve el mouse para seguir la melodía",
 init:()=>{ ka={t:0,pts:0,y:H/2,linea:[],ult:0};
   for(let i=0;i<600;i++) ka.linea.push(H/2+Math.sin(i*0.045)*130+Math.sin(i*0.012)*70); },
 paso:()=>{ const g=ka; fondo("#140a22"); g.t++;
   ctx.strokeStyle="#c58cff"; ctx.lineWidth=7; ctx.lineCap="round"; ctx.beginPath();
   for(let i=0;i<W;i+=4){ const k=g.t+i; const y=g.linea[k%g.linea.length];
     i?ctx.lineTo(i,y):ctx.moveTo(i,y); } ctx.stroke();
   const objetivo=g.linea[(g.t+W*0.25)%g.linea.length];
   g.y+=(raton.y-g.y)*0.3;
   const d=Math.abs(g.y-objetivo);
   ctx.fillStyle=d<34?"#39ff14":"#ff5b6e";
   ctx.beginPath(); ctx.arc(W*0.25,g.y,20,0,7); ctx.fill();
   texto("🎤",W*0.25,g.y,24);
   if(d<34){ g.pts++;

   texto("🗑 BORRAR",W/2+69,H-47,17);
   info("♪ "+g.puestas+" notas");
   if(g.puestas>=16 && g.son){ anota("Compositor",g.puestas); ganar("🏆 ¡COMPUSISTE UNA CANCIÓN!",g.puestas+" notas"); }
 },
 clic:(x,y)=>{ const g=cm;
   if(y>H-70){ if(x>W/2-120&&x<W/2-10){ g.son=!g.son; g.paso=-1; }
     else if(x>W/2+14&&x<W/2+124){ g.rej=Array(8).fill(0).map(()=>Array(16).fill(false)); g.puestas=0; }
     return; }
   const cw=(W-120)/16, chh=(H-200)/8;
   const c=Math.floor((x-60)/cw), f=Math.floor((y-110)/chh);
   if(c<0||c>=16||f<0||f>=8) return;
   g.rej[f][c]=!g.rej[f][c];
   if(g.rej[f][c]){ nota(ESCALA[7-f],0.3,"triangle"); g.puestas++; } else g.puestas--; }});

// 18) BATALLA DE BANDAS
let bb;
add({ico:"🏟️",nom:"Batalla",ayuda:"2 jugadores: A gana la izquierda, L la derecha",
 init:()=>{ bb={a:0,b:0,t:0,obj:30,ba:0,bb2:0}; },
 paso:()=>{ const g=bb; fondo("#0a0618"); g.t++;
   if(g.ba>0) g.ba-=0.08; if(g.bb2>0) g.bb2-=0.08;
   caja(0,0,W/2,H, "rgba(255,91,110,"+(0.08+g.ba*0.25)+")",null,0);
   caja(W/2,0,W/2,H, "rgba(47,208,255,"+(0.08+g.bb2*0.25)+")",null,0);
   ctx.strokeStyle="#fff"; ctx.lineWidth=3;
   ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
   texto("🎸 BANDA A",W*0.25,56,26,"#ff5b6e");
   texto("🎹 BANDA B",W*0.75,56,26,"#2fd0ff");
   texto("tecla A",W*0.25,H-40,18,"#ff8fa0");
   texto("tecla L",W*0.75,H-40,18,"#8fd4ff");
   // barras
   const bh=H-220;
   caja(W*0.25-50,140,100,bh,"rgba(0,0,0,.35)",null,12);
   caja(W*0.25-50,140+bh*(1-g.a/g.obj),100,bh*g.a/g.obj,"#ff5b6e",null,12);
   caja(W*0.75-50,140,100,bh,"rgba(0,0,0,.35)",null,12);
   caja(W*0.75-50,140+bh*(1-g.b/g.obj),100,bh*g.b/g.obj,"#2fd0ff",null,12);
   texto(g.a+"",W*0.25,110,30,"#ff5b6e"); texto(g.b+"",W*0.75,110,30,"#2fd0ff");
   info("primero en "+g.obj);
   if(g.a>=g.obj){ anota("Batalla",g.a); ganar("🎸 ¡GANA LA BANDA A!",""); }
   if(g.b>=g.obj){ anota("Batalla",g.b); ganar("🎹 ¡GANA LA BANDA B!",""); }
 },
 clic:(x)=>{ if(x<W/2){ bb.a++; bb.ba=1; nota(ESCALA[bb.a%8],0.14,"sawtooth",0.12); }
   else { bb.b++; bb.bb2=1; nota(ESCALA[bb.b%8]+12,0.14,"square",0.1); } },
 tecla:(k)=>{ if(k==="a"){ bb.a++; bb.ba=1; nota(ESCALA[bb.a%8],0.14,"sawtooth",0.12); }
   if(k==="l"){ bb.b++; bb.bb2=1; nota(ESCALA[bb.b%8]+12,0.14,"square",0.1); } }});

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
