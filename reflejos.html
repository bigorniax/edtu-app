<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Test de Reflejos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;touch-action:manipulation}
  body{display:flex;flex-direction:column;background:#141428;color:#fff;transition:background .08s}
  body.espera{background:#8a1a1a}
  body.ya{background:#14a033}
  .top{text-align:center;padding:14px 12px 6px;flex-shrink:0}
  .top h1{font-size:22px;letter-spacing:.02em}
  .top p{font-size:13px;opacity:.75;margin-top:2px}
  .zona{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:16px}
  .big{font-size:clamp(34px,9vw,64px);font-weight:900;text-align:center;line-height:1.15}
  .crono{font-size:clamp(44px,14vw,96px);font-weight:900;color:#ffd12e;text-shadow:0 0 24px rgba(255,209,46,.45);margin-top:10px;
    font-variant-numeric:tabular-nums}
  .sub{font-size:16px;opacity:.85;margin-top:12px;text-align:center}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 12px 16px;flex-shrink:0}
  .card{background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 16px;text-align:center;min-width:92px}
  .card .lbl{font-size:11px;opacity:.7;letter-spacing:.06em}
  .card .val{font-size:21px;font-weight:900;margin-top:2px}
  .card.best{border-color:#ffd12e}.card.best .val{color:#ffd12e}
  .hist{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 12px 12px;flex-shrink:0}
  .h{font-size:12px;background:rgba(0,0,0,.3);border-radius:8px;padding:4px 9px;opacity:.85}
  .rank{text-align:center;font-size:15px;font-weight:800;padding:0 12px 6px;min-height:22px}
  .puesto{text-align:center;font-size:14px;padding:0 12px 10px;min-height:20px;color:#ffd12e;opacity:.95}
</style>
</head>
<body class="listo">
  <div class="top">
    <h1>⚡ Test de Reflejos</h1>
    <p>Espera el <b>VERDE</b> y toca lo más rápido que puedas</p>
  </div>

  <div class="zona" id="zona">
    <div class="big" id="big">👆 Toca para empezar</div>
    <div class="crono" id="crono" style="display:none">0 ms</div>
    <div class="sub" id="sub">También sirve la <b>barra espaciadora</b></div>
  </div>

  <div class="rank" id="rank"></div>
  <div class="puesto" id="puesto"></div>

  <div class="stats">
    <div class="card best"><div class="lbl">🏆 TU RÉCORD</div><div class="val" id="best">—</div></div>
    <div class="card"><div class="lbl">ÚLTIMO</div><div class="val" id="last">—</div></div>
    <div class="card"><div class="lbl">PROMEDIO</div><div class="val" id="avg">—</div></div>
    <div class="card"><div class="lbl">INTENTOS</div><div class="val" id="n">0</div></div>
  </div>
  <div class="hist" id="hist"></div>

<script>
const $=id=>document.getElementById(id);
const K_BEST="edtu_reflejos_best";      // ⚠ guarda el MEJOR tiempo (el más bajo)
const K_HIST="edtu_reflejos_hist";

let estado="listo";      // listo | espera | ya | resultado | falso
let t0=0, timer=null, raf=null;   // raf = el intervalo del cronómetro
let hist=[];
try{
  hist=JSON.parse(localStorage.getItem(K_HIST)||"[]");
  // 🧹 limpieza: fuera los tiempos imposibles que se colaron antes del arreglo.
  // Menos de 100 ms = tocaste en el cambio (nadie reacciona tan rápido).
  // Más de 1000 ms = te despistaste, no fue un intento de verdad.
  const antes = hist.length;
  hist = hist.filter(v=> v>=100 && v<=1000);
  if(hist.length !== antes) localStorage.setItem(K_HIST, JSON.stringify(hist));
}catch(e){ hist=[]; }
let best=null;
try{
  const b=parseInt(localStorage.getItem(K_BEST)||"0",10);
  // un récord menor a 100 ms es imposible: se coló antes del arreglo
  if(b>=100 && b<=1000) best=b;
  else if(b>0){ best = hist.length ? Math.min(...hist) : null;
                if(best) localStorage.setItem(K_BEST,String(best)); else localStorage.removeItem(K_BEST); }
}catch(e){}

function pinta(){
  $("best").textContent = best!=null ? best+" ms" : "—";
  $("last").textContent = hist.length ? hist[hist.length-1]+" ms" : "—";
  $("n").textContent = hist.length;
  if(hist.length){
    const prom = Math.round(hist.reduce((a,b)=>a+b,0)/hist.length);
    $("avg").textContent = prom+" ms";
  } else $("avg").textContent="—";
  $("hist").innerHTML = hist.slice(-8).map(v=>'<span class="h">'+v+'</span>').join("");
}
function medalla(ms){
  if(ms<180) return "🥇 ¡INCREÍBLE! Reflejos de campeón";
  if(ms<230) return "🥈 ¡Muy rápido!";
  if(ms<300) return "🥉 ¡Bien!";
  if(ms<400) return "👍 Normal";
  return "🐢 Despierta un poco 😄";
}
function setCuerpo(c){ document.body.className=c; }

function empezar(){
  estado="espera"; setCuerpo("espera");
  $("big").textContent="Espera el VERDE…";
  $("crono").style.display="none";
  $("sub").textContent="¡NO toques todavía!";
  $("rank").textContent="";
  const espera = 1200 + Math.random()*3000;
  timer = setTimeout(()=>{
    estado="ya"; setCuerpo("ya");
    $("big").textContent="¡YA! 👆";
    $("crono").style.display="block";
    $("sub").textContent="";
    t0 = performance.now();
    // ⏱️ el cronómetro sube a la vista.
    // Con setInterval (no requestAnimationFrame) para que corra igual aunque
    // la pestaña esté en segundo plano o el navegador frene los frames.
    $("crono").textContent = "0 ms";
    clearInterval(raf);
    raf = setInterval(()=>{ if(estado!=="ya"){ clearInterval(raf); return; }
      const ms = Math.round(performance.now()-t0);
      $("crono").textContent = ms+" ms";
      // ⏰ Si pasa 1 segundo sin tocar, no cuenta: se te fue. Si no, un
      // despiste de 3 segundos quedaba guardado y arruinaba tu promedio.
      if(ms > 1000){
        clearInterval(raf); estado="falso"; setCuerpo("listo");
        $("big").textContent="😴 ¡Te dormiste!";
        $("crono").style.display="none";
        $("sub").textContent="Más de 1 segundo no cuenta. Toca para reintentar.";
        $("rank").textContent="";
      }
    }, 10);
  }, espera);
}

function tocar(){
  if(estado==="listo" || estado==="resultado" || estado==="falso"){ empezar(); return; }
  if(estado==="espera"){            // se adelantó
    clearTimeout(timer); estado="falso"; setCuerpo("listo");
    $("big").textContent="😅 ¡Te adelantaste!";
    $("crono").style.display="none";
    $("sub").textContent="Espera a que se ponga VERDE. Toca para reintentar.";
    return;
  }
  if(estado==="ya"){
    clearInterval(raf);
    const ms = Math.round(performance.now()-t0);
    /* 🚫 TIEMPOS IMPOSIBLES.
       Ningún ser humano reacciona en menos de ~100 ms: la señal tiene que
       llegar del ojo al cerebro y volver al dedo. Un tiempo menor significa
       que tocaste justo en el cambio o que mantenías el dedo apretado, no
       que reaccionaste. Si lo dejáramos pasar, arruinaría el ranking de
       todos (alguien con 6 ms sería siempre primero). */
    if(ms < 100){
      estado="falso"; setCuerpo("listo");
      $("big").textContent="🤨 ¡Demasiado rápido!";
      $("crono").style.display="none";
      $("sub").textContent="Nadie reacciona en menos de 100 ms. Suelta el dedo y espera el verde.";
      $("rank").textContent="";
      return;
    }
    estado="resultado"; setCuerpo("listo");
    $("crono").textContent = ms+" ms";
    $("big").textContent="⚡ "+ms+" ms";
    $("sub").textContent="Toca para intentar otra vez";
    hist.push(ms); if(hist.length>50) hist=hist.slice(-50);
    let nuevo=false;
    if(best==null || ms<best){ best=ms; nuevo=true; }   // el récord es el MÁS BAJO
    try{
      localStorage.setItem(K_HIST, JSON.stringify(hist));
      localStorage.setItem(K_BEST, String(best));       // se guarda tu tiempo mínimo
      if(window.parent && window.parent.edtuPlayDay) window.parent.edtuPlayDay("Reflejos", ms+" ms", ms);
    }catch(e){}
    $("rank").innerHTML = (nuevo?"🎉 <span style='color:#ffd12e'>¡NUEVO RÉCORD!</span> · ":"") + medalla(ms);
    pinta();
    // ☁️ guardar en la cuenta y mostrar en qué puesto vas (si entró con cuenta)
    if(nuevo) guardarEnCuenta(ms);
    verPuesto();
  }
}

/* ☁️ CUENTA Y PUESTO
   El juego vive en un iframe dentro de EDTU, así que puede pedirle a la
   página de arriba (window.parent) que guarde el récord en la cuenta y
   que le diga en qué puesto va. Si se abre suelto, simplemente no pasa nada. */
function cuentaDeArriba(){
  try{ const C = window.parent && window.parent.Cuenta;
       return (C && C.logueado && C.logueado()) ? C : null; }catch(e){ return null; }
}
function guardarEnCuenta(ms){
  const C = cuentaDeArriba(); if(!C) return;
  // en reflejos gana el MENOR, así que guardamos solo si mejora
  try{ C.guardarRecordMenor ? C.guardarRecordMenor("reflejos", ms) : C.guardarRecord("reflejos", ms); }catch(e){}
}
/* 🧹 Arreglo de récords viejos mal guardados.
   Antes del arreglo, el sistema guardaba el tiempo MÁS ALTO (trataba los
   milisegundos como si fueran puntos), así que a mucha gente le quedó un
   tiempo malísimo como "récord". Si el de la cuenta es peor que el de este
   dispositivo, lo corregimos con el bueno. */
async function arreglaRecordViejo(){
  const C = cuentaDeArriba(); if(!C || best==null) return;
  try{
    const enNube = await C.leerRecord("reflejos");
    if(enNube > 0 && enNube > best){
      // el de la nube es peor: lo pisamos con el bueno de este dispositivo
      await C.guardarRecordMenor("reflejos", best);
    }
  }catch(e){}
}

async function verPuesto(){
  const C = cuentaDeArriba();
  if(!C){ $("puesto").textContent = "Entra con tu cuenta para competir con los demás 🏅"; return; }
  try{
    const p = await C.miPuesto("reflejos", true);   // true = gana el más bajo
    if(!p){ $("puesto").textContent = ""; return; }
    const med = p.puesto===1?"🥇":p.puesto===2?"🥈":p.puesto===3?"🥉":"🏅";
    $("puesto").innerHTML = med+" Vas en el <b>puesto "+p.puesto+"</b> de "+p.total+" jugadores";
  }catch(e){ $("puesto").textContent=""; }
}

$("zona").addEventListener("pointerdown", e=>{ e.preventDefault(); tocar(); });
addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); tocar(); } });
pinta();
// al abrir: corrige el récord si quedó mal guardado antes, y muestra el puesto
(async ()=>{ await arreglaRecordViejo(); verPuesto(); })();

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
</script>
</body>
</html>
