<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Ciencia</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;
    background:radial-gradient(ellipse at 50% 0%,#07324a,#02101a 60%);color:#dff1ff}
  #menu{position:absolute;inset:0;overflow-y:auto;padding:16px}
  #menu h1{text-align:center;font-size:25px;color:#2fd0ff;text-shadow:0 0 16px rgba(47,208,255,.45)}
  #menu .sub{text-align:center;color:#8ab4c8;font-size:13px;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:1000px;margin:0 auto}
  .gbtn{cursor:pointer;border:2px solid rgba(47,208,255,.3);border-radius:14px;padding:13px 9px;text-align:center;
    background:linear-gradient(160deg,rgba(10,52,74,.9),rgba(4,16,26,.9));transition:all .14s}
  .gbtn:hover{transform:translateY(-3px);border-color:#2fd0ff;box-shadow:0 7px 20px rgba(47,208,255,.24)}
  .gbtn .ico{font-size:28px;display:block;margin-bottom:4px}
  .gbtn .nm{font-weight:800;font-size:13px;color:#fff}
  #play{position:absolute;inset:0;display:none;flex-direction:column}
  #play.on{display:flex}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:rgba(2,16,26,.92);
    border-bottom:1px solid rgba(47,208,255,.25);flex-shrink:0;gap:8px}
  .bar h2{font-size:16px;color:#2fd0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .info{font-weight:800;font-size:15px;color:#ffd12e;white-space:nowrap}
  .bar button{cursor:pointer;background:rgba(255,91,110,.15);border:1.5px solid rgba(255,91,110,.5);color:#ff8fa0;
    border-radius:9px;padding:6px 11px;font-weight:700;font-size:12px;white-space:nowrap}
  #stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none;border-radius:10px}
  .help{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#8ab4c8;font-size:12px;pointer-events:none}
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(1,10,18,.93);text-align:center;padding:20px;z-index:5}
  .win.on{display:flex}
  .win h2{font-size:28px;margin-bottom:8px;color:#2fd0ff}
  .win p{color:#9fd4e8;font-size:15px;max-width:520px;line-height:1.5}
  .win button{margin-top:16px;cursor:pointer;font-size:17px;font-weight:900;border:none;border-radius:14px;padding:13px 30px;
    color:#021018;background:linear-gradient(90deg,#2fd0ff,#5fe0a0)}
</style>
</head>
<body>
<div id="menu">
  <h1>🔬 Ciencia e Inventos</h1>
  <p class="sub">Experimenta, construye y descubre · <b>18 juegos</b></p>
  <div class="grid" id="grid"></div>
</div>
<div id="play">
  <div class="bar">
    <h2 id="gname">Juego</h2>
    <span class="info" id="info"></span>
    <button id="back">✕ Menú</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="help" id="help"></div>
    <div class="win" id="win"><h2 id="winTxt">¡Bien!</h2><p id="winSub"></p><button id="again">▶ Otra vez</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
let W=700,H=560;
function tam(w,h){ W=w;H=h;cv.width=w;cv.height=h;fit(); }
function fit(){ const st=$("stage"); const m=Math.min((st.clientWidth-16)/W,(st.clientHeight-16)/H,1.6);
  cv.style.width=(W*m)+"px"; cv.style.height=(H*m)+"px"; }
addEventListener("resize",fit);
function fondo(c){ ctx.fillStyle=c||"#04121e"; ctx.fillRect(0,0,W,H); }
function texto(t,x,y,s,c,a){ ctx.fillStyle=c||"#fff"; ctx.font="900 "+(s||20)+"px Segoe UI,sans-serif";
  ctx.textAlign=a||"center"; ctx.textBaseline="middle"; ctx.fillText(t,x,y); }
function caja(x,y,w,h,f,b,r){ r=r||8; ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(f){ctx.fillStyle=f;ctx.fill();} if(b){ctx.strokeStyle=b;ctx.lineWidth=2;ctx.stroke();} }
function info(t){ $("info").textContent=t||""; }
function ganar(t,s){ $("winTxt").innerHTML=t; $("winSub").textContent=s||""; $("win").classList.add("on"); }
function anota(n,p){ try{ const k="edtu_ciencia_best"; const v=Math.max(parseInt(localStorage.getItem(k)||"0",10)||0,p||1);
  localStorage.setItem(k,String(v));
  if(window.parent&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("Ciencia: "+n,p,p); }catch(e){} }

const teclas={}; let raton={x:W/2,y:H/2,abajo:false};
function posEn(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
cv.addEventListener("pointermove",e=>{ const p=posEn(e); raton.x=p.x; raton.y=p.y;
  if(raton.abajo&&juego&&juego.arrastra) juego.arrastra(p.x,p.y); });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); const p=posEn(e); raton.x=p.x; raton.y=p.y; raton.abajo=true;
  if(juego&&juego.clic) juego.clic(p.x,p.y); });
cv.addEventListener("pointerup",()=>{ raton.abajo=false; if(juego&&juego.suelta) juego.suelta(); });
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); teclas[k]=true; if(juego&&juego.tecla) juego.tecla(k);
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault(); });
addEventListener("keyup",e=>{ teclas[e.key.toLowerCase()]=false; });

let juego=null, raf=null;
function abrir(j){ juego=j; $("gname").textContent=j.ico+" "+j.nom; $("help").innerHTML=j.ayuda||"";
  $("menu").style.display="none"; $("play").classList.add("on"); $("win").classList.remove("on");
  info(""); tam(j.w||700,j.h||560); j.init();
  if(raf) cancelAnimationFrame(raf);
  const b=()=>{ raf=requestAnimationFrame(b); if(!$("win").classList.contains("on")) j.paso(); }; b(); }
function cerrar(){ if(raf) cancelAnimationFrame(raf); raf=null; juego=null;
  $("play").classList.remove("on"); $("menu").style.display="block"; }
$("back").onclick=cerrar;
$("again").onclick=()=>{ $("win").classList.remove("on"); info(""); juego.init(); };

const JUEGOS=[];
const add=(o)=>JUEGOS.push(o);

/* ===================== 18 DE CIENCIA ===================== */

// 1) CIRCUITO
let ci;
add({ico:"💡",nom:"Circuito",ayuda:"Conecta la pila con la ampolleta girando los cables",
 init:()=>{ ci={n:4,rej:[],movs:0};
   const N=4; ci.rej=[];
   for(let i=0;i<N*N;i++) ci.rej.push({t:(Math.random()<0.4?"L":"I"),g:(Math.random()*4)|0});
   ci.rej[0]={t:"P",g:0}; ci.rej[N*N-1]={t:"B",g:0}; },
 paso:()=>{ const g=ci; fondo("#06202e");
   const N=g.n, S=Math.min(100,(H-180)/N), ox=(W-N*S)/2, oy=100;
   const enc=energiza();
   for(let i=0;i<N*N;i++){ const c=g.rej[i], x=ox+(i%N)*S, y=oy+((i/N)|0)*S;
     caja(x+3,y+3,S-6,S-6,"rgba(255,255,255,.05)","rgba(47,208,255,.25)",8);
     ctx.save(); ctx.translate(x+S/2,y+S/2); ctx.rotate(c.g*Math.PI/2);
     ctx.strokeStyle=enc.has(i)?"#ffd12e":"#4a7a90"; ctx.lineWidth=8; ctx.lineCap="round";
     if(c.t==="I"){ ctx.beginPath(); ctx.moveTo(0,-S/2+6); ctx.lineTo(0,S/2-6); ctx.stroke(); }
     else if(c.t==="L"){ ctx.beginPath(); ctx.moveTo(0,-S/2+6); ctx.lineTo(0,0); ctx.lineTo(S/2-6,0); ctx.stroke(); }
     else { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,S/2-6); ctx.stroke(); }
     ctx.restore();
     if(c.t==="P") texto("🔋",x+S/2,y+S/2-8,30);
     if(c.t==="B") texto(enc.has(i)?"💡":"🔅",x+S/2,y+S/2-8,30); }
   texto("Toca los cables para girarlos",W/2,60,21,"#2fd0ff");
   info("🔧 "+g.movs+" giros");
   if(enc.has(N*N-1)){ anota("Circuito",Math.max(1,100-g.movs)); ganar("🏆 ¡LUZ!","en "+g.movs+" giros"); }
 },
 clic:(x,y)=>{ const g=ci, N=g.n, S=Math.min(100,(H-180)/N), ox=(W-N*S)/2, oy=100;
   const c=Math.floor((x-ox)/S), r=Math.floor((y-oy)/S);
   if(c<0||c>=N||r<0||r>=N) return;
   g.rej[r*N+c].g=(g.rej[r*N+c].g+1)%4; g.movs++; }});
// salidas de cada pieza segun su giro: 0=arriba 1=derecha 2=abajo 3=izquierda
function salidas(c){ const base = c.t==="I" ? [0,2] : c.t==="L" ? [0,1] : [2];
  return base.map(d=>(d+c.g)%4); }
function energiza(){ const g=ci, N=g.n, vis=new Set(), pila=[0];
  while(pila.length){ const i=pila.pop(); if(vis.has(i)) continue; vis.add(i);
    const r=(i/N)|0, c=i%N;
    for(const d of salidas(g.rej[i])){
      const nr=r+(d===0?-1:d===2?1:0), nc=c+(d===1?1:d===3?-1:0);
      if(nr<0||nr>=N||nc<0||nc>=N) continue;
      const j=nr*N+nc, op=(d+2)%4;
      if(salidas(g.rej[j]).includes(op)) pila.push(j); } }
  return vis; }

// 2) BALANZA
let bz;
add({ico:"⚖️",nom:"Balanza",ayuda:"Pon pesas hasta equilibrar los dos platos",
 init:()=>{ bz={obj:0,puestas:[],pesas:[1,2,5,10,20],ronda:0};
   bz.obj=3+Math.floor(Math.random()*35); },
 paso:()=>{ const g=bz; fondo("#06202e");
   const suma=g.puestas.reduce((a,b)=>a+b,0), dif=suma-g.obj;
   const ang=Math.max(-0.28,Math.min(0.28,dif*0.03));
   texto("Equilibra: "+g.obj+" g",W/2,54,26,"#2fd0ff");
   ctx.save(); ctx.translate(W/2,190); ctx.rotate(ang);
   ctx.strokeStyle="#9fd4e8"; ctx.lineWidth=8; ctx.lineCap="round";
   ctx.beginPath(); ctx.moveTo(-200,0); ctx.lineTo(200,0); ctx.stroke();
   [-200,200].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,70); ctx.stroke();
     ctx.fillStyle="#2a6a8a"; ctx.beginPath(); ctx.ellipse(x,78,62,14,0,0,7); ctx.fill(); });
   ctx.restore();
   ctx.fillStyle="#4a7a90"; ctx.beginPath();
   ctx.moveTo(W/2-28,320); ctx.lineTo(W/2+28,320); ctx.lineTo(W/2,186); ctx.fill();
   texto(g.obj+" g",W/2-200,200+Math.sin(-ang)*0,22,"#ffd12e");
   texto(suma+" g",W/2+200,200,22, dif===0?"#39ff14":"#ff8fa0");
   g.pesas.forEach((p,i)=>{ const x=W/2+(i-2)*120;
     caja(x-50,H-130,100,80,"rgba(47,208,255,.14)","#2fd0ff",12);
     texto(p+" g",x,H-90,22); });
   texto("🗑 quitar todo",W/2,H-28,17,"#8ab4c8");
   info("⚖️ "+suma+" / "+g.obj+" g  ·  ronda "+(g.ronda+1));
   if(dif===0 && g.puestas.length){ g.ronda++;
     if(g.ronda>=5){ anota("Balanza",g.ronda); ganar("🏆 ¡5 PESADAS EXACTAS!",""); }
     else { g.puestas=[]; g.obj=3+Math.floor(Math.random()*35); } }
 },
 clic:(x,y)=>{ const g=bz;
   if(y>H-45){ g.puestas=[]; return; }
   if(y>H-130&&y<H-50){ g.pesas.forEach((p,i)=>{ const cx=W/2+(i-2)*120;
     if(Math.abs(x-cx)<50) g.puestas.push(p); }); } }});

// 3) ESTADOS DEL AGUA
let ea;
add({ico:"🌡️",nom:"Estados",ayuda:"Sube y baja la temperatura · hielo, agua y vapor",
 init:()=>{ ea={T:20,metas:[0,100,-10,50],i:0,t:0,part:[]};
   for(let k=0;k<60;k++) ea.part.push({x:160+Math.random()*(W-320),y:H-260+Math.random()*180,vx:0,vy:0}); },
 paso:()=>{ const g=ea; fondo("#06202e"); g.t++;
   const T=g.T, est = T<=0?"HIELO 🧊":T>=100?"VAPOR ☁️":"AGUA 💧";
   // vaso
   caja(150,H-300,W-300,250,"rgba(255,255,255,.04)","#4a7a90",10);
   g.part.forEach(p=>{
     if(T<=0){ p.vx*=0.7; p.vy*=0.7; }
     else if(T>=100){ p.vx+=(Math.random()-0.5)*1.6; p.vy-=0.5+Math.random()*0.5; }
     else { p.vx+=(Math.random()-0.5)*T*0.014; p.vy+=(Math.random()-0.5)*T*0.014+0.08; }
     p.vx*=0.95; p.vy*=0.95; p.x+=p.vx; p.y+=p.vy;
     if(p.x<160){p.x=160;p.vx*=-0.6;} if(p.x>W-160){p.x=W-160;p.vx*=-0.6;}
     if(p.y>H-60){p.y=H-60;p.vy*=-0.4;}
     if(p.y<H-295){ if(T>=100){ p.y=H-70; p.x=160+Math.random()*(W-320); } else {p.y=H-295;p.vy*=-0.5;} }
     ctx.fillStyle=T<=0?"#bfeaff":T>=100?"rgba(220,240,255,.6)":"#2fd0ff";
     ctx.beginPath(); ctx.arc(p.x,p.y,T<=0?6:5,0,7); ctx.fill(); });
   texto(est,W/2,64,32, T<=0?"#bfeaff":T>=100?"#dfe8f0":"#2fd0ff");
   // termometro
   caja(W-96,100,34,H-420,"rgba(0,0,0,.35)",null,17);
   const f=(T+20)/140;
   caja(W-96,100+(H-420)*(1-f),34,(H-420)*f, T<=0?"#5fb8ff":T>=100?"#ff5b6e":"#ffd12e",null,17);
   texto(Math.round(T)+"°",W-79,H-300,18);
   texto("⬆ W / ⬇ S  o toca arriba y abajo",W/2,H-26,16,"#8ab4c8");
   if(teclas["arrowup"]||teclas["w"]) g.T=Math.min(120,g.T+0.8);
   if(teclas["arrowdown"]||teclas["s"]) g.T=Math.max(-20,g.T-0.8);
   if(raton.abajo) g.T = raton.y<H/2 ? Math.min(120,g.T+0.8) : Math.max(-20,g.T-0.8);
   const meta=g.metas[g.i];
   texto("Objetivo: "+meta+"°",W/2,110,22,"#ffd12e");
   info("🎯 "+g.i+"/4");
   if(Math.abs(T-meta)<2.5){ g.i++;
     if(g.i>=g.metas.length){ anota("Estados",4);
       ganar("🏆 ¡CIENTÍFICO DEL AGUA!","el agua se congela a 0° y hierve a 100°"); } }
 }});

// 4) ÁTOMOS
let at;
add({ico:"⚛️",nom:"Átomos",ayuda:"Pon los electrones en sus capas: 2, 8, 8",
 init:()=>{ at={e:0,obj:2+Math.floor(Math.random()*16),t:0,ok:0}; },
 paso:()=>{ const g=at; fondo("#04141e"); g.t++;
   const cx=W/2, cy=H/2-10;
   ctx.fillStyle="#ff5b6e"; ctx.beginPath(); ctx.arc(cx,cy,42,0,7); ctx.fill();
   texto(g.obj+"",cx,cy,26,"#fff");
   const CAP=[2,8,8], R=[95,160,225];
   let q=g.e;
   for(let c=0;c<3;c++){ ctx.strokeStyle="rgba(47,208,255,.3)"; ctx.lineWidth=2;
     ctx.beginPath(); ctx.arc(cx,cy,R[c],0,7); ctx.stroke();
     const n=Math.min(CAP[c],q); q-=n;
     for(let i=0;i<n;i++){ const a=i/CAP[c]*Math.PI*2+g.t*0.012*(c%2?-1:1);
       ctx.fillStyle="#2fd0ff"; ctx.beginPath();
       ctx.arc(cx+Math.cos(a)*R[c],cy+Math.sin(a)*R[c],10,0,7); ctx.fill(); } }
   texto("Electrones: "+g.e+" / "+g.obj,W/2,44,24,"#2fd0ff");
   caja(W/2-170,H-66,150,50,"rgba(57,255,20,.16)","#39ff14",12); texto("➕ electrón",W/2-95,H-41,18);
   caja(W/2+20,H-66,150,50,"rgba(255,91,110,.16)","#ff5b6e",12); texto("➖ quitar",W/2+95,H-41,18);
   info("⚛️ "+g.ok+"/5 átomos");
   if(g.e===g.obj && g.t>20){ g.ok++;
     if(g.ok>=5){ anota("Átomos",g.ok); ganar("🏆 ¡5 ÁTOMOS!","las capas llevan 2, 8 y 8 electrones"); }
     else { g.e=0; g.obj=2+Math.floor(Math.random()*16); g.t=0; } }
 },
 clic:(x,y)=>{ const g=at; if(y<H-70) return;
   if(x>W/2-170&&x<W/2-20) g.e=Math.min(18,g.e+1);
   if(x>W/2+20&&x<W/2+170) g.e=Math.max(0,g.e-1); }});

// 5) PALANCA
let pl;
add({ico:"🪨",nom:"Palanca",ayuda:"Mueve el apoyo para levantar la roca",
 init:()=>{ pl={ap:W/2,peso:40+Math.floor(Math.random()*120),fuerza:25,ronda:0,t:0}; },
 paso:()=>{ const g=pl; fondo("#06202e"); g.t++;
   const x0=100, x1=W-100;
   const bRoca=g.ap-x0, bTu=x1-g.ap;
   const torRoca=g.peso*bRoca, torTu=g.fuerza*bTu;
   const sube=torTu>torRoca;
   const ang=sube?-0.2:0.2;
   ctx.save(); ctx.translate(g.ap,H-170); ctx.rotate(ang);
   ctx.strokeStyle="#c8a060"; ctx.lineWidth=14; ctx.lineCap="round";
   ctx.beginPath(); ctx.moveTo(-(g.ap-x0),0); ctx.lineTo(x1-g.ap,0); ctx.stroke();
   texto("🪨",-(g.ap-x0)+20,-32,46);
   texto("🧒",x1-g.ap-20,-30,40);
   ctx.restore();
   ctx.fillStyle="#4a7a90"; ctx.beginPath();
   ctx.moveTo(g.ap-34,H-80); ctx.lineTo(g.ap+34,H-80); ctx.lineTo(g.ap,H-164); ctx.fill();
   texto("Roca: "+g.peso+" kg · tú empujas con "+g.fuerza+" kg",W/2,54,21,"#2fd0ff");
   texto(sube?"✅ ¡LA LEVANTAS!":"❌ pesa mucho: acerca el apoyo a la roca",
     W/2,96,22, sube?"#39ff14":"#ff8fa0");
   texto("arrastra el apoyo ↔",W/2,H-34,16,"#8ab4c8");
   info("🪨 "+g.ronda+"/5");
   if(sube && g.t>40){ g.ronda++;
     if(g.ronda>=5){ anota("Palanca",g.ronda);
       ganar("🏆 ¡MAESTRO DE LA PALANCA!","mientras más cerca el apoyo de la carga, menos fuerza necesitas"); }
     else { g.peso=40+Math.floor(Math.random()*160); g.ap=W/2; g.t=0; } }
 },
 arrastra:(x)=>{ pl.ap=Math.max(160,Math.min(W-160,x)); },
 clic:(x)=>{ pl.ap=Math.max(160,Math.min(W-160,x)); }});

// 6) IMANES
let im;
add({ico:"🧲",nom:"Imanes",ayuda:"Atrae la bolita al objetivo · iguales se repelen",
 init:()=>{ im={b:{x:W/2,y:H-120,vx:0,vy:0},pol:1,meta:{x:W/2,y:110},muros:[],t:0,ok:0};
   for(let i=0;i<3;i++) im.muros.push({x:120+i*((W-240)/2),y:200+i*90,w:150,h:18}); },
 paso:()=>{ const g=im; fondo("#04141e"); g.t++;
   g.muros.forEach(m=>caja(m.x-m.w/2,m.y,m.w,m.h,"#4a7a90",null,6));
   texto("🎯",g.meta.x,g.meta.y,40);
   // el raton es un iman
   ctx.strokeStyle=g.pol>0?"#ff5b6e":"#2fd0ff"; ctx.lineWidth=3;
   ctx.beginPath(); ctx.arc(raton.x,raton.y,30,0,7); ctx.stroke();
   texto(g.pol>0?"N":"S",raton.x,raton.y,22,g.pol>0?"#ff5b6e":"#2fd0ff");
   const b=g.b, dx=raton.x-b.x, dy=raton.y-b.y, d=Math.max(26,Math.hypot(dx,dy));
   const F=g.pol*260/(d*d);
   b.vx+=dx/d*F*10; b.vy+=dy/d*F*10+0.14;
   b.vx*=0.985; b.vy*=0.985; b.x+=b.vx; b.y+=b.vy;
   if(b.x<14){b.x=14;b.vx*=-0.6;} if(b.x>W-14){b.x=W-14;b.vx*=-0.6;}
   if(b.y>H-14){b.y=H-14;b.vy*=-0.5;} if(b.y<14){b.y=14;b.vy*=-0.5;}

   ctx.strokeStyle="#39ff14"; ctx.lineWidth=3; ctx.setLineDash([8,8]);
   ctx.beginPath(); ctx.ellipse(g.obj.x,sy,46*g.obj.e,18*g.obj.e,0,0,7); ctx.stroke(); ctx.setLineDash([]);
   // objeto y luz
   ctx.fillStyle="#c8a060"; ctx.fillRect(ox-24,oy-50,48,100);
   ctx.fillStyle="rgba(255,209,46,.22)"; ctx.beginPath(); ctx.arc(g.lx,g.ly,70,0,7); ctx.fill();
   texto("🔦",g.lx,g.ly,38);
   texto("Mueve la linterna",W/2,40,22,"#2fd0ff");
   const d=Math.abs(sx-g.obj.x)+Math.abs(escala-g.obj.e)*70;
   texto(d<34?"✅ ¡calza!":"",W/2,H-42,22,"#39ff14");
   info("🔦 "+g.ok+"/4");
   if(d<34 && g.t>25){ g.ok++;
     if(g.ok>=4){ anota("Sombras",g.ok);
       ganar("🏆 ¡MAESTRO DE LA LUZ!","mientras más cerca la luz, más grande la sombra"); }
     else { nuevaSombra(); g.t=0; } }
 },
 arrastra:(x,y)=>{ so.lx=x; so.ly=Math.max(30,Math.min(H/2-90,y)); },
 clic:(x,y)=>{ so.lx=x; so.ly=Math.max(30,Math.min(H/2-90,y)); }});
function nuevaSombra(){ so.obj={x:W/2+(Math.random()-0.5)*300,e:1+Math.random()*1.8}; }

// 16) PLANETAS EN ORDEN
let po;
add({ico:"🪐",nom:"Planetas",ayuda:"Ordena del más cerca al más lejos del Sol",
 init:()=>{ const P=[["☿ Mercurio","#b0a090"],["♀ Venus","#e8c070"],["🌍 Tierra","#2fd0ff"],
   ["♂ Marte","#ff5b6e"],["♃ Júpiter","#e8a860"],["♄ Saturno","#f0d890"],
   ["♅ Urano","#90e8e0"],["♆ Neptuno","#5b7bff"]];
   po={P,orden:P.slice().sort(()=>Math.random()-0.5),sig:0,err:0}; },
 paso:()=>{ const g=po; fondo("#02060f");
   for(let i=0;i<30;i++){ ctx.fillStyle="rgba(255,255,255,.4)"; ctx.fillRect((i*211)%W,(i*97)%H,2,2); }
   ctx.fillStyle="#ffd12e"; ctx.beginPath(); ctx.arc(20,H/2,54,0,7); ctx.fill();
   texto("Del más CERCA al más LEJOS del Sol",W/2,42,21,"#2fd0ff");
   g.orden.forEach((p,i)=>{ if(g.P.slice(0,g.sig).some(q=>q[0]===p[0])) return;
     const x=W/2+((i%4)-1.5)*165, y=H/2-50+(i<4?0:120);
     caja(x-76,y-40,152,80,"rgba(255,255,255,.07)",p[1],12);
     texto(p[0],x,y,17,p[1]); });
   // ya puestos
   g.P.slice(0,g.sig).forEach((p,i)=>{ const x=110+i*((W-160)/8);
     ctx.fillStyle=p[1]; ctx.beginPath(); ctx.arc(x,H-60,15,0,7); ctx.fill(); });
   info("🪐 "+g.sig+"/8  ❌"+g.err);
   if(g.sig>=8){ anota("Planetas",Math.max(1,20-g.err));
     ganar("🏆 ¡SISTEMA SOLAR!","Me Ven Tan Mal Jugando Sudokus Un Novato 😄"); }
 },
 clic:(x,y)=>{ const g=po;
   for(let i=0;i<8;i++){ const cx=W/2+((i%4)-1.5)*165, cy=H/2-50+(i<4?0:120);
     if(Math.abs(x-cx)<76&&Math.abs(y-cy)<40){
       if(g.orden[i][0]===g.P[g.sig][0]) g.sig++; else g.err++;
       return; } } }});

// 17) COHETE DE AGUA
let ca;
add({ico:"🚀",nom:"Cohete",ayuda:"Elige agua y presión · llega a la marca",
 init:()=>{ ca={agua:40,pres:40,volando:false,y:0,v:0,t:0,meta:0,ok:0}; ca.meta=250+Math.random()*250; },
 paso:()=>{ const g=ca; fondo("#8ac4e8"); g.t++;
   ctx.fillStyle="#5aa02a"; ctx.fillRect(0,H-50,W,50);
   // marca objetivo
   ctx.strokeStyle="#ff5b6e"; ctx.lineWidth=3; ctx.setLineDash([10,8]);
   const my=H-60-g.meta*0.6;
   ctx.beginPath(); ctx.moveTo(0,my); ctx.lineTo(W,my); ctx.stroke(); ctx.setLineDash([]);
   texto("🎯 "+Math.round(g.meta)+" m",70,my-18,18,"#ff5b6e");
   if(g.volando){ g.v-=0.32; g.y+=g.v;
     if(g.y<=0){ g.volando=false;
       const alt=g.maxY||0;
       if(Math.abs(alt-g.meta)<45){ g.ok++;
         if(g.ok>=3){ anota("Cohete",g.ok);
           ganar("🏆 ¡PUNTERÍA PERFECTA!","mucha agua pesa; poca no empuja: el truco es la mitad"); return; }
         g.meta=250+Math.random()*250; }
       g.y=0; g.maxY=0; }
     else g.maxY=Math.max(g.maxY||0,g.y);
     for(let k=0;k<3;k++){ ctx.fillStyle="rgba(200,230,255,.6)";
       ctx.beginPath(); ctx.arc(W/2+(Math.random()-0.5)*22,H-60-g.y*0.6+30+Math.random()*20,6,0,7); ctx.fill(); } }
   texto("🚀",W/2,H-70-g.y*0.6,44);
   if(!g.volando){
     [["💧 agua",g.agua,"#2fd0ff",-1],["💨 presión",g.pres,"#ffd12e",1]].forEach(([n,v,c,s])=>{
       const x=W/2+s*170, y=H-150;
       texto(n+": "+Math.round(v)+"%",x,y-40,19,c);
       caja(x-110,y-16,220,28,"rgba(0,0,0,.35)",null,14);
       caja(x-110,y-16,220*v/100,28,c,null,14); });
     caja(W/2-85,H-72,170,46,"rgba(57,255,20,.2)","#39ff14",12);
     texto("🚀 LANZAR",W/2,H-49,19); }
   info("🎯 "+g.ok+"/3" + (g.volando?"  altura "+Math.round(g.y)+" m":""));
 },
 arrastra:(x,y)=>{ mueveCohete(x,y); },
 clic:(x,y)=>{ const g=ca;
   if(!g.volando && y>H-76 && Math.abs(x-W/2)<85){
     // empuje: optimo cerca del 50% de agua
     const ef=1-Math.abs(g.agua-50)/60;
     g.v=(g.pres/100)*28*Math.max(0.15,ef); g.y=0.1; g.maxY=0; g.volando=true; return; }
   mueveCohete(x,y); }});
function mueveCohete(x,y){ const g=ca; if(g.volando) return;
  if(Math.abs(y-(H-166))>24) return;
  for(const [s,k] of [[-1,"agua"],[1,"pres"]]){ const cx=W/2+s*170;
    if(Math.abs(x-cx)<112) g[k]=Math.max(5,Math.min(100,(x-(cx-110))/220*100)); } }

// 18) CLASIFICA
let cl;
add({ico:"🧪",nom:"Clasifica",ayuda:"¿Sólido, líquido o gas?",
 init:()=>{ const T=[["🧊","sólido"],["💧","líquido"],["☁️","gas"],["🪨","sólido"],
   ["🥛","líquido"],["🎈","gas"],["🧱","sólido"],["🧃","líquido"],
   ["💨","gas"],["⚽","sólido"],["🫧","gas"],["🍯","líquido"]];
   cl={cola:T.slice().sort(()=>Math.random()-0.5),ok:0,mal:0}; },
 paso:()=>{ const g=cl; fondo("#06202e");
   const act=g.cola[0];
   if(!act){ anota("Clasifica",g.ok);
     ganar(g.mal===0?"🏆 ¡PERFECTO!":"🧪 ¡Listo!",g.ok+" aciertos, "+g.mal+" errores"); return; }
   texto("¿Qué estado es?",W/2,56,24,"#2fd0ff");
   texto(act[0],W/2,180,96);
   [["🧱 SÓLIDO","#c8a060"],["💧 LÍQUIDO","#2fd0ff"],["☁️ GAS","#dfe8f0"]].forEach((c,i)=>{
     const x=W/2+(i-1)*230;
     caja(x-105,H-180,210,120,"rgba(255,255,255,.06)",c[1],16);
     texto(c[0],x,H-120,21,c[1]); });
   info("✅"+g.ok+"  ❌"+g.mal);
 },
 clic:(x,y)=>{ const g=cl, act=g.cola[0]; if(!act) return;
   if(y<H-180||y>H-60) return;
   const E=["sólido","líquido","gas"];
   for(let i=0;i<3;i++){ const cx=W/2+(i-1)*230;
     if(Math.abs(x-cx)<105){ if(E[i]===act[1]) g.ok++; else g.mal++;
       g.cola.shift(); return; } } }});

$("grid").innerHTML = JUEGOS.map((j,i)=>
  '<div class="gbtn" data-i="'+i+'"><span class="ico">'+j.ico+'</span><span class="nm">'+j.nom+'</span></div>').join("");

fit();

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
</script>
