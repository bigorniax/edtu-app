<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Nave Neón</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;background:#02030a;color:#eaf6ff}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:100%;border-radius:12px;touch-action:none;
    box-shadow:0 0 28px rgba(0,190,255,.3),inset 0 0 40px rgba(0,190,255,.1)}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;
    font-weight:900;font-size:17px;pointer-events:none;text-shadow:0 0 8px #0cf}
  #hud span:nth-child(2){color:#ffd12e;text-shadow:0 0 8px #ffd12e}
  #ayuda{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#6fb8d8;font-size:13px;pointer-events:none}
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(2,3,10,.92);text-align:center;padding:20px}
  #menu h1{font-size:40px;letter-spacing:4px;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #0cf,0 0 40px #0cf}
  #menu p{margin:14px 0 22px;color:#7fc8e8;line-height:1.6;font-size:16px;max-width:460px}
  #menu button{cursor:pointer;padding:16px 42px;border-radius:14px;border:2px solid #0cf;background:rgba(0,0,0,.6);
    color:#fff;font-size:20px;font-weight:900;letter-spacing:2px;box-shadow:0 0 14px #0cf;text-shadow:0 0 8px #0cf}
  #menu button:hover{transform:scale(1.05)}
  #menu .stats{margin-top:18px;color:#ffd12e;font-weight:800;text-shadow:0 0 8px #ffd12e;line-height:1.7}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="640"></canvas>
  <div id="hud"><span id="vida">vidas 3</span><span id="puntos">0</span><span id="nivel">nivel 1</span></div>
  <div id="ayuda">← → mueven · ESPACIO dispara · P pausa</div>
  <div id="menu">
    <h1>NAVE NEÓN</h1>
    <p>Dispara a los enemigos que bajan. Junta los power-ups: el doble disparo dura poco, el escudo te protege de un golpe. Cada nivel vienen más rápidos.</p>
    <button id="empezar">JUGAR</button>
    <div class="stats" id="stats"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const W=cv.width, H=cv.height;
const CLAVE="edtu_nave_mejor";

function leer(){ try{ return parseInt(localStorage.getItem(CLAVE)||"0",10)||0; }catch(e){ return 0; } }
function guardar(v){ try{ localStorage.setItem(CLAVE,String(v)); }catch(e){} }

let audio=null;
function tono(f,d,tipo,vol,subida){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(), g=audio.createGain(); o.type=tipo||"square"; const t=audio.currentTime;
  o.frequency.setValueAtTime(f,t); if(subida) o.frequency.exponentialRampToValueAtTime(f*subida,t+d);
  g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+d); }catch(e){} }

/* ---------- estado ---------- */
let nave, balas=[], enemigos=[], extras=[], explosiones=[], estrellas=[];
let vidas=3, puntos=0, nivel=1, vivo=false, pausado=false, raf=null, tiempo=0, cadencia=0;
let dobleT=0, escudoT=0, teclas={l:false,r:false,f:false};
let mouseX=null;

function reiniciar(){
  nave={x:W/2,y:H-60,w:36,h:28};
  balas=[]; enemigos=[]; extras=[]; explosiones=[];
  vidas=3; puntos=0; nivel=1; tiempo=0; cadencia=0; dobleT=0; escudoT=0;
  estrellas=[];
  for(let i=0;i<70;i++) estrellas.push({x:Math.random()*W,y:Math.random()*H,v:0.5+Math.random()*2.5});
}

function empezar(){
  $("menu").style.display="none";
  reiniciar();
  vivo=true; pausado=false;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(paso);
}

function disparar(){
  if(!vivo||pausado||cadencia>0) return;
  cadencia=dobleT>0?8:14;
  if(dobleT>0){
    balas.push({x:nave.x-9,y:nave.y-18,v:-9}); balas.push({x:nave.x+9,y:nave.y-18,v:-9});
  } else balas.push({x:nave.x,y:nave.y-18,v:-9});
  tono(740,0.06,"square",0.04,0.5);
}

function paso(){
  raf=requestAnimationFrame(paso);
  if(!vivo||pausado){ if(pausado) dibujar(); return; }
  tiempo++;
  if(cadencia>0) cadencia--;
  if(dobleT>0) dobleT--;
  if(escudoT>0) escudoT--;
  if(teclas.l) nave.x-=6; if(teclas.r) nave.x+=6;
  if(mouseX!==null) nave.x+=(mouseX-nave.x)*0.25;
  nave.x=Math.max(nave.w/2,Math.min(W-nave.w/2,nave.x));
  if(teclas.f) disparar();

  // el nivel sube cada 20 segundos
  nivel=1+Math.floor(tiempo/1200);
  // enemigos: cada cierto tiempo aparece uno o un grupo
  const cada=Math.max(18,60-nivel*5);
  if(tiempo%cada===0){
    const n=1+Math.floor(Math.random()*Math.min(4,nivel));
    for(let i=0;i<n;i++) enemigos.push({x:30+Math.random()*(W-60),y:-30-i*40,v:1.2+nivel*0.25+Math.random()*0.6,hp:nivel>=4&&Math.random()<0.3?2:1,
      tipo:Math.random()<0.2?"zig":"recto",fase:Math.random()*6});
  }
  // power-ups
  if(tiempo%900===0 && tiempo>0){
    extras.push({x:40+Math.random()*(W-80),y:-20,tipo:Math.random()<0.5?"doble":"escudo"});
  }

  estrellas.forEach(s=>{ s.y+=s.v; if(s.y>H){ s.y=0; s.x=Math.random()*W; } });

  balas.forEach(b=>b.y+=b.v);
  balas=balas.filter(b=>b.y>-20);

  enemigos.forEach(e=>{
    e.y+=e.v;
    if(e.tipo==="zig"){ e.fase+=0.06; e.x+=Math.sin(e.fase)*2.2; }
    e.x=Math.max(20,Math.min(W-20,e.x));
  });
  // balas contra enemigos
  for(let i=enemigos.length-1;i>=0;i--){
    const e=enemigos[i];
    for(let j=balas.length-1;j>=0;j--){
      const b=balas[j];
      if(Math.abs(b.x-e.x)<20 && Math.abs(b.y-e.y)<20){
        balas.splice(j,1); e.hp--;
        if(e.hp<=0){
          enemigos.splice(i,1); puntos+=10*nivel; boom(e.x,e.y,"#ff3b5c",16); tono(300,0.12,"sawtooth",0.05,0.3);
        } else { boom(e.x,e.y,"#ffd12e",6); }
        break;
      }
    }
  }
  // enemigos contra la nave
  for(let i=enemigos.length-1;i>=0;i--){
    const e=enemigos[i];
    if(e.y>H+30){ enemigos.splice(i,1); continue; }
    if(Math.abs(e.x-nave.x)<26 && Math.abs(e.y-nave.y)<26){
      enemigos.splice(i,1);
      if(escudoT>0){ escudoT=0; boom(e.x,e.y,"#b6ff00",20); tono(500,0.2,"triangle",0.06,0.5); }
      else { golpe(); if(!vivo) return; }
    }
  }
  // power-ups
  extras.forEach(x=>x.y+=2.2);
  for(let i=extras.length-1;i>=0;i--){
    const x=extras[i];
    if(x.y>H+20){ extras.splice(i,1); continue; }
    if(Math.abs(x.x-nave.x)<26 && Math.abs(x.y-nave.y)<26){
      extras.splice(i,1);
      if(x.tipo==="doble") dobleT=600; else escudoT=600;
      tono(660,0.2,"sine",0.07,1.5);
    }
  }
  explosiones.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vida--; });
  explosiones=explosiones.filter(p=>p.vida>0);

  dibujar();
  $("vida").textContent="vidas "+vidas;
  $("puntos").textContent=puntos;
  $("nivel").textContent="nivel "+nivel;
}

function boom(x,y,color,n){
  for(let i=0;i<n;i++) explosiones.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,vida:24,color});
}

function golpe(){
  vidas--; boom(nave.x,nave.y,"#0cf",26); tono(160,0.4,"sawtooth",0.08,0.3);
  enemigos=enemigos.filter(e=>Math.abs(e.y-nave.y)>120);
  if(vidas<=0){ perder(); }
}

function perder(){
  vivo=false; cancelAnimationFrame(raf);
  const mejor=leer(), nuevo=puntos>mejor;
  if(nuevo) guardar(puntos);
  dibujar(); pintarFin(nuevo);
  setTimeout(()=>{ cv.onclick=()=>{ cv.onclick=null; empezar(); }; },500);
}

function dibujar(){
  ctx.fillStyle="#02030a"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";
  estrellas.forEach(s=>{ ctx.globalAlpha=0.3+s.v/3.5; ctx.fillRect(s.x,s.y,2,2); });
  ctx.globalAlpha=1;
  // power-ups
  extras.forEach(x=>{
    const c=x.tipo==="doble"?"#ffd12e":"#b6ff00";
    ctx.strokeStyle=c; ctx.lineWidth=3; ctx.shadowColor=c; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x.x,x.y,14,0,7); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=c; ctx.font="900 14px Segoe UI,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(x.tipo==="doble"?"x2":"S",x.x,x.y+1);
  });
  // enemigos
  enemigos.forEach(e=>{
    const c=e.hp>1?"#ffd12e":"#ff3b5c";
    ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(e.x,e.y+16); ctx.lineTo(e.x+18,e.y-12); ctx.lineTo(e.x,e.y-4); ctx.lineTo(e.x-18,e.y-12); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
  });
  // balas
  ctx.fillStyle="#0cf"; ctx.shadowColor="#0cf"; ctx.shadowBlur=10;
  balas.forEach(b=>ctx.fillRect(b.x-2,b.y,4,14));
  ctx.shadowBlur=0;
  // nave
  if(vivo||!pausado){
    if(escudoT>0){ ctx.strokeStyle="#b6ff00"; ctx.lineWidth=3; ctx.shadowColor="#b6ff00"; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(nave.x,nave.y,30,0,7); ctx.stroke(); ctx.shadowBlur=0; }
    ctx.fillStyle="#0cf"; ctx.shadowColor="#0cf"; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(nave.x,nave.y-18); ctx.lineTo(nave.x+18,nave.y+12); ctx.lineTo(nave.x-18,nave.y+12); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
  }
  // explosiones
  explosiones.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.vida/24); ctx.fillStyle=p.color; ctx.fillRect(p.x-2,p.y-2,4,4); });
  ctx.globalAlpha=1;
  if(dobleT>0){ ctx.fillStyle="#ffd12e"; ctx.font="700 13px Segoe UI,sans-serif"; ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillText("DOBLE DISPARO "+Math.ceil(dobleT/60)+"s",10,40); }
  if(pausado){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff"; ctx.font="900 40px Segoe UI,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("PAUSA",W/2,H/2); }
}

function pintarFin(nuevo){
  ctx.fillStyle="rgba(0,0,0,.62)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.font="900 40px Segoe UI,sans-serif";
  ctx.shadowColor="#f05"; ctx.shadowBlur=18; ctx.fillText("NAVE DESTRUIDA",W/2,H/2-60); ctx.shadowBlur=0;
  ctx.fillStyle="#ffd12e"; ctx.font="800 24px Segoe UI,sans-serif"; ctx.fillText(puntos+" puntos · nivel "+nivel,W/2,H/2-12);
  ctx.fillStyle=nuevo?"#b6ff00":"#7fc8e8"; ctx.font="700 16px Segoe UI,sans-serif";
  ctx.fillText(nuevo?"¡NUEVO RÉCORD!":"Récord: "+leer(),W/2,H/2+24);
  ctx.fillStyle="#7fc8e8"; ctx.font="600 15px Segoe UI,sans-serif";
  ctx.fillText("toca para volver a jugar",W/2,H/2+62);
}

/* ---------- controles ---------- */
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") teclas.l=true;
  if(k==="arrowright"||k==="d") teclas.r=true;
  if(k===" "){ e.preventDefault(); teclas.f=true; disparar(); }
  if(k==="p"&&vivo){ pausado=!pausado; }
  if(["arrowleft","arrowright"].includes(k)) e.preventDefault();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") teclas.l=false;
  if(k==="arrowright"||k==="d") teclas.r=false;
  if(k===" ") teclas.f=false;
});
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(); mouseX=(e.clientX-r.left)*(W/r.width);
});
cv.addEventListener("pointerleave",()=>{ mouseX=null; });
cv.addEventListener("pointerdown",e=>{
  const r=cv.getBoundingClientRect(); mouseX=(e.clientX-r.left)*(W/r.width);
  disparar();
});
$("empezar").onclick=empezar;

function pintarMenu(){ $("stats").innerHTML="Récord de puntos: "+leer(); }
reiniciar(); vivo=false; pintarMenu(); dibujar();

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
</script>
</body>
</html>
