<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Juegos</title>
<link rel="stylesheet" href="nuevo.css" />
<style>
  :root{--fondo:#050505;--tarjeta:#0b0b0c;--texto:#dfe3e8;--suave:#9aa2ab;--linea:rgba(255,255,255,.12);--plata:#c9d0d8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--fondo);color:var(--texto);font-family:"AW",system-ui,sans-serif}
  .cabeza{padding:96px 22px 14px;max-width:1200px;margin:0 auto}
  .logo{font-size:26px;letter-spacing:.14em;background:linear-gradient(180deg,#fff,#d7dce2 45%,#8c949d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .volver{color:var(--suave);text-decoration:none;font-size:13px;letter-spacing:.12em;border:1px solid var(--linea);border-radius:8px;padding:8px 12px}
  .volver:hover{color:#fff;border-color:var(--plata)}
  .busca{display:block;width:100%;max-width:1200px;margin:14px auto 0;padding:12px 16px;border-radius:10px;border:1px solid var(--linea);background:#0b0b0c;color:var(--texto);font-family:"AW",sans-serif;font-size:15px;outline:none}
  .busca:focus{border-color:var(--plata)}
  .cats{max-width:1200px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap}
  .cat{cursor:pointer;background:transparent;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-family:"AW",sans-serif;font-size:12px;letter-spacing:.06em}
  .cat:hover{color:#fff}
  .cat.on{color:#140d02;background:linear-gradient(180deg,var(--acento-claro),var(--acento));border-color:var(--acento)}
  main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .info{color:var(--suave);font-size:13px;letter-spacing:.08em;margin-bottom:14px}
  .grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .card{cursor:pointer;text-align:left;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:16px;color:var(--texto);font-family:"AW",sans-serif;transition:border-color .15s,transform .15s}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,184,77,.5)}
  .card .ico{font-size:26px;display:block;margin-bottom:10px}
  .card .nom{display:block;font-size:14px;letter-spacing:.04em;line-height:1.3;color:#e6e9ed}
  .card .pk{display:block;margin-top:8px;font-size:11px;color:var(--suave);letter-spacing:.08em}
  .card{position:relative}
  .card .nuevo{position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:.14em;padding:3px 7px;border-radius:999px;
    color:#140d02;background:linear-gradient(180deg,var(--acento-claro),var(--acento));box-shadow:0 0 12px rgba(255,184,77,.45)}
  .vacio{display:none;color:var(--suave);padding:30px 0;text-align:center}

  /* juego a pantalla completa */
  #jugar{position:fixed;top:var(--barra);left:0;right:0;bottom:0;z-index:40;background:#000;display:none;flex-direction:column}
  #jugar.on{display:flex}
  #jugar .barra{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#050505;border-bottom:1px solid var(--linea)}
  #jugar .titulo{font-size:14px;letter-spacing:.1em;color:var(--plata);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jugar button{cursor:pointer;background:transparent;color:var(--texto);border:1px solid var(--linea);border-radius:8px;padding:7px 12px;font-family:"AW",sans-serif;font-size:12px}
  #jugar button:hover{border-color:var(--plata);color:#fff}
  #marco{flex:1;width:100%;border:none;background:#000}
  #marco.escondido{visibility:hidden}
  #cargando{position:absolute;left:0;right:0;top:50%;text-align:center;color:var(--suave);font-size:13px;letter-spacing:.2em;display:none}
  #jugar.cargando #cargando{display:block}
</style>
</head>
<body>
<nav class="topbar">
  <a class="logo" href="index.html">EDTU</a>
  <div class="menu-top"><a href="index.html">INICIO</a><a href="juegos.html">JUEGOS</a><a href="chat.html">CHAT</a><a href="social.html">RÉCORDS Y AMIGOS</a></div>
  <div class="cuenta" id="cuenta"></div>
</nav>
<header class="cabeza">
  <input class="busca" id="busca" type="search" placeholder="Busca un juego…" autocomplete="off" />
  <div class="cats" id="cats"></div>
</header>
<main>
  <div class="info" id="info"></div>
  <div class="grilla" id="grilla"></div>
  <div class="vacio" id="vacio">No encontré ese juego. Prueba con otra palabra.</div>
</main>

<div id="jugar">
  <div class="barra">
    <div class="titulo" id="tituloJuego"></div>
    <button id="cerrar">✕ CERRAR</button>
  </div>
  <div id="cargando">CARGANDO…</div>
  <iframe id="marco" allow="fullscreen; autoplay; gamepad; pointer-lock" title="Juego"></iframe>
</div>

<script src="nuevo.js"></script>
<script src="juegos-datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// categorias: "Todos" + cada categoria que aparece en los juegos
const CATS = ["Todos"];
JUEGOS.forEach(j => { if (!CATS.includes(j.pack)) CATS.push(j.pack); });
let catActiva = "Todos";

function pintaCats() {
  $("cats").innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat" + (c === catActiva ? " on" : "");
    b.textContent = c.toUpperCase();
    b.onclick = () => { catActiva = c; pintaCats(); filtra(); };
    $("cats").appendChild(b);
  });
}

function filtra() {
  const q = norm($("busca").value.trim());
  const lista = JUEGOS.filter(j =>
    (catActiva === "Todos" || j.pack === catActiva) &&
    (!q || norm(j.nom).includes(q) || norm(j.pack).includes(q)));
  $("grilla").innerHTML = "";
  lista.forEach(j => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = (j.nuevo ? '<span class="nuevo">NUEVO</span>' : '') + '<span class="ico">' + j.ico + '</span><span class="nom">' + j.nom + '</span><span class="pk">' + j.pack.toUpperCase() + '</span>';
    b.onclick = () => abrir(j);
    $("grilla").appendChild(b);
  });
  $("info").textContent = lista.length + " juegos";
  $("vacio").style.display = lista.length ? "none" : "block";
}

/* abrir: carga la pagina del juego y lo arranca solo, sin boton de jugar */
let arrancado = false, timer = null;
function abrir(j) {
  $("tituloJuego").textContent = j.ico + " " + j.nom.toUpperCase();
  arrancado = false;
  const marco = $("marco");
  marco.onload = () => arrancar(j);
  // juegos grandes: viven en la pagina vieja, que se carga ESCONDIDA en "modo juego"
  // y solo se muestra cuando el juego ya esta abierto (aviso edtuJuegoAbierto)
  marco.classList.toggle("escondido", !!j.abrir);
  $("jugar").classList.toggle("cargando", !!j.abrir);
  marco.src = j.abrir ? j.file + "?juego=" + j.abrir : j.file;
  $("jugar").classList.add("on");
  // el foco pasa al juego: si no, las teclas se quedan en la pagina de afuera
  [200, 700, 1500].forEach(ms => setTimeout(enfocaJuego, ms));
  document.body.style.overflow = "hidden";
  clearInterval(timer);
  // respaldo: si no llega el aviso de carga, reintenta cada 200 ms (12 s como maximo)
  let n = 0;
  timer = setInterval(() => { n++; if (arrancado || n > 100) { clearInterval(timer); return; } arrancar(j); }, 200);
}
function arrancar(j) {
  if (arrancado) return;
  try {
    const d = $("marco").contentDocument;
    // esperar a que la pagina cargue ENTERA: si se aprieta antes, el boton todavia no tiene su codigo y el clic se pierde
    if (!d || d.readyState !== "complete" || d.location.href === "about:blank") return;
    if (j.abrir) {                                      // juegos grandes: se abren con su boton de la pagina vieja
      const b = d.getElementById(j.abrir);
      if (b) { b.click(); arrancado = true; }
      return;
    }
    const boton = d.getElementById("empezar");          // juegos sueltos
    if (boton) { boton.click(); arrancado = true; return; }
    if (j.idx !== null) {                                // juegos de paquetes
      const g = d.querySelector('.gbtn[data-i="' + j.idx + '"]');
      if (g) { g.click(); arrancado = true; }
    }
  } catch (e) {}
}
function enfocaJuego() {
  try {
    const m = $("marco");
    m.focus();
    if (m.contentWindow) m.contentWindow.focus();
  } catch (e) {}
}
$("jugar").addEventListener("pointerdown", enfocaJuego);

/* boton de ATRAS del mouse dentro de CUALQUIER juego: se engancha a la pagina del juego
   y a los marcos que tenga adentro (los juegos grandes tienen marcos dentro de marcos).
   Siempre vuelve al selector nuevo, nunca a la pagina vieja. */
function enganchaAtras(doc) {
  if (!doc || doc.__edtuAtras) return;
  doc.__edtuAtras = true;
  ["mousedown", "mouseup", "auxclick"].forEach(ev => doc.addEventListener(ev, e => {
    if (e.button !== 3 && e.button !== 4) return;
    e.preventDefault(); e.stopPropagation();
    if (ev === "mouseup" && e.button === 3 && $("jugar").classList.contains("on")) cerrar();
  }, true));
}
function recorreMarcos(win, n) {
  try {
    enganchaAtras(win.document);
    if (n < 3) for (const f of win.document.querySelectorAll("iframe")) if (f.contentWindow) recorreMarcos(f.contentWindow, n + 1);
  } catch (e) {}
}
setInterval(() => { if ($("jugar").classList.contains("on")) recorreMarcos($("marco").contentWindow, 0); }, 300);
/* avisos que llegan desde el juego:
   - edtuJuegoAbierto: el juego grande ya esta a la vista -> mostrar el marco
   - edtuJuegoCerrado / edtuAtras / edtuCerrarMundo: el juego se cerro o apretaste
     atras (boton del mouse, ✕ Salir, boton EDTU) -> volver al selector */
addEventListener("message", e => {
  if (e.source !== $("marco").contentWindow) return;
  const d = e.data || {};
  if (d.edtuJuegoAbierto) { $("marco").classList.remove("escondido"); $("jugar").classList.remove("cargando"); enfocaJuego(); }
  if ((d.edtuJuegoCerrado || d.edtuAtras || d.edtuCerrarMundo) && $("jugar").classList.contains("on")) cerrar();
});
function cerrar() {
  clearInterval(timer);
  $("marco").classList.remove("escondido");
  $("jugar").classList.remove("cargando");
  $("marco").onload = null;
  $("marco").src = "about:blank";
  $("jugar").classList.remove("on");
  document.body.style.overflow = "";
}
$("cerrar").onclick = cerrar;
addEventListener("keydown", e => { if (e.key === "Escape" && $("jugar").classList.contains("on")) cerrar(); });
$("busca").addEventListener("input", filtra);

/* boton lateral del mouse: vuelve del juego al selector */
["mousedown", "mouseup", "auxclick"].forEach(ev => {
  document.addEventListener(ev, e => {
    if (e.button === 3 || e.button === 4) {
      e.preventDefault(); e.stopPropagation();
      if (ev === "mouseup" && e.button === 3 && $("jugar").classList.contains("on")) cerrar();
    }
  }, true);
});

pintaCats();
filtra();
</script>
</body>
</html>
