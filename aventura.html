<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Aventura</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;
    background:radial-gradient(ellipse at 50% 0%,#10302a,#050f0c 60%);color:#dff}
  #menu{position:absolute;inset:0;overflow-y:auto;padding:16px}
  #menu h1{text-align:center;font-size:25px;color:#5fe0a0;text-shadow:0 0 16px rgba(95,224,160,.45)}
  #menu .sub{text-align:center;color:#8ba;font-size:13px;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:1000px;margin:0 auto}
  .gbtn{cursor:pointer;border:2px solid rgba(95,224,160,.3);border-radius:14px;padding:13px 9px;text-align:center;
    background:linear-gradient(160deg,rgba(16,44,38,.9),rgba(6,16,14,.9));transition:all .14s}
  .gbtn:hover{transform:translateY(-3px);border-color:#5fe0a0;box-shadow:0 7px 20px rgba(95,224,160,.22)}
  .gbtn .ico{font-size:28px;display:block;margin-bottom:4px}
  .gbtn .nm{font-weight:800;font-size:13px;color:#fff}
  #play{position:absolute;inset:0;display:none;flex-direction:column}
  #play.on{display:flex}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:rgba(4,12,10,.9);
    border-bottom:1px solid rgba(95,224,160,.25);flex-shrink:0;gap:8px}
  .bar h2{font-size:16px;color:#5fe0a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .info{font-weight:800;font-size:15px;color:#ffd12e;white-space:nowrap}
  .bar button{cursor:pointer;background:rgba(255,91,110,.15);border:1.5px solid rgba(255,91,110,.5);color:#ff8fa0;
    border-radius:9px;padding:6px 11px;font-weight:700;font-size:12px;white-space:nowrap}
  #stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none;border-radius:10px}
  .help{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#8ba;font-size:12px;pointer-events:none}
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(3,10,8,.93);text-align:center;padding:20px;z-index:5}
  .win.on{display:flex}
  .win h2{font-size:28px;margin-bottom:8px;color:#5fe0a0}
  .win button{margin-top:16px;cursor:pointer;font-size:17px;font-weight:900;border:none;border-radius:14px;padding:13px 30px;
    color:#021018;background:linear-gradient(90deg,#5fe0a0,#2fd0ff)}
</style>
</head>
<body>
<div id="menu">
  <h1>🗺️ Aventura y Estrategia</h1>
  <p class="sub">Para pensar y explorar · <b>18 juegos</b></p>
  <div class="grid" id="grid"></div>
</div>
<div id="play">
  <div class="bar">
    <h2 id="gname">Juego</h2>
    <span class="info" id="info"></span>
    <button id="back">✕ Menú</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="help" id="help"></div>
    <div class="win" id="win"><h2 id="winTxt">¡Bien!</h2><p id="winSub"></p><button id="again">▶ Otra vez</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
let W=700,H=560;
function tam(w,h){ W=w;H=h;cv.width=w;cv.height=h;fit(); }
function fit(){ const st=$("stage"); const m=Math.min((st.clientWidth-16)/W,(st.clientHeight-16)/H,1.6);
  cv.style.width=(W*m)+"px"; cv.style.height=(H*m)+"px"; }
addEventListener("resize",fit);
function fondo(c){ ctx.fillStyle=c||"#081812"; ctx.fillRect(0,0,W,H); }
function texto(t,x,y,s,c,a){ ctx.fillStyle=c||"#fff"; ctx.font="900 "+(s||20)+"px Segoe UI,sans-serif";
  ctx.textAlign=a||"center"; ctx.textBaseline="middle"; ctx.fillText(t,x,y); }
function caja(x,y,w,h,f,b,r){ r=r||8; ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(f){ctx.fillStyle=f;ctx.fill();} if(b){ctx.strokeStyle=b;ctx.lineWidth=2;ctx.stroke();} }
function info(t){ $("info").textContent=t||""; }
function ganar(t,s){ $("winTxt").innerHTML=t; $("winSub").textContent=s||""; $("win").classList.add("on"); }
function anota(n,p){ try{ const k="edtu_aventura_best"; const v=Math.max(parseInt(localStorage.getItem(k)||"0",10)||0,p||1);
  localStorage.setItem(k,String(v));
  if(window.parent&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("Aventura: "+n,p,p); }catch(e){} }

const teclas={}; let raton={x:W/2,y:H/2};
function posEn(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
cv.addEventListener("pointermove",e=>{ const p=posEn(e); raton.x=p.x; raton.y=p.y; });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); const p=posEn(e); raton.x=p.x; raton.y=p.y;
  if(juego&&juego.clic) juego.clic(p.x,p.y); });
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); teclas[k]=true; if(juego&&juego.tecla) juego.tecla(k);
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault(); });
addEventListener("keyup",e=>{ teclas[e.key.toLowerCase()]=false; });

let juego=null, raf=null;
function abrir(j){ juego=j; $("gname").textContent=j.ico+" "+j.nom; $("help").innerHTML=j.ayuda||"";
  $("menu").style.display="none"; $("play").classList.add("on"); $("win").classList.remove("on");
  info(""); tam(j.w||700,j.h||560); j.init();
  if(raf) cancelAnimationFrame(raf);
  const b=()=>{ raf=requestAnimationFrame(b); if(!$("win").classList.contains("on")) j.paso(); }; b(); }
function cerrar(){ if(raf) cancelAnimationFrame(raf); raf=null; juego=null;
  $("play").classList.remove("on"); $("menu").style.display="block"; }
$("back").onclick=cerrar;
$("again").onclick=()=>{ $("win").classList.remove("on"); info(""); juego.init(); };

const JUEGOS=[];
const add=(ico,nom,ayuda,init,paso,clic,tecla,w,h)=>JUEGOS.push({ico,nom,ayuda,init,paso,clic,tecla,w,h});

/* ===================== 18 DE AVENTURA Y ESTRATEGIA ===================== */

// 1) BUSCA EL TESORO
let bt;
add("🗺️","Tesoro","Toca para cavar · te dice si estás cerca (🔥 o ❄️)",
 ()=>{ const N=8; bt={N,t:{r:(Math.random()*N)|0,c:(Math.random()*N)|0},
   abiertas:Array.from({length:N},()=>Array(N).fill(null)),intentos:0}; },
 ()=>{ fondo("#1a1408"); const N=bt.N, S=58, ox=(W-N*S)/2, oy=(H-N*S)/2;
   texto("🗺️ Busca el tesoro",W/2,46,26,"#ffd12e");
   for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const v=bt.abiertas[r][c];
     caja(ox+c*S+2,oy+r*S+2,S-4,S-4, v===null?"#5a4a28":"#2a2010","#8a7a4a",6);
     if(v!==null) texto(v,ox+c*S+S/2,oy+r*S+S/2,24); }
   info("cavadas: "+bt.intentos);
 },
 (x,y)=>{ const N=bt.N, S=58, ox=(W-N*S)/2, oy=(H-N*S)/2;
   const c=Math.floor((x-ox)/S), r=Math.floor((y-oy)/S);
   if(r<0||r>=N||c<0||c>=N||bt.abiertas[r][c]!==null) return;
   bt.intentos++;
   const d=Math.max(Math.abs(r-bt.t.r),Math.abs(c-bt.t.c));
   if(d===0){ bt.abiertas[r][c]="💎"; anota("Tesoro",bt.intentos);
     ganar("💎 ¡TESORO!","en "+bt.intentos+" intentos"); return; }
   bt.abiertas[r][c] = d===1?"🔥" : d===2?"🌡️" : d<=4?"❄️" : "🧊"; });

// 2) BARCOS
let ba;
add("🚢","Barcos","Hunde los 5 barcos escondidos",
 ()=>{ const N=8; const g=Array.from({length:N},()=>Array(N).fill(0));
   [4,3,3,2,2].forEach(len=>{ let puesto=false;
     while(!puesto){ const hor=Math.random()<.5, r=(Math.random()*N)|0, c=(Math.random()*N)|0;
       if(hor? c+len>N : r+len>N) continue;
       let libre=true;
       for(let i=0;i<len;i++){ if(g[r+(hor?0:i)][c+(hor?i:0)]) libre=false; }
       if(!libre) continue;
       for(let i=0;i<len;i++) g[r+(hor?0:i)][c+(hor?i:0)]=1;
       puesto=true; } });
   ba={N,g,v:Array.from({length:N},()=>Array(N).fill(0)),tiros:0,tocados:0}; },
 ()=>{ fondo("#06243a"); const N=ba.N, S=60, ox=(W-N*S)/2, oy=(H-N*S)/2;
   texto("🚢 Hunde los barcos",W/2,44,26,"#5fd1ff");
   for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const v=ba.v[r][c];
     caja(ox+c*S+2,oy+r*S+2,S-4,S-4, v===0?"#0d3a5a":(v===1?"#8a2020":"#1a2a3a"),"#2a5a7a",6);
     if(v===1) texto("💥",ox+c*S+S/2,oy+r*S+S/2,26);
     if(v===2) texto("🌊",ox+c*S+S/2,oy+r*S+S/2,22); }
   info("tiros: "+ba.tiros+"  tocados: "+ba.tocados+"/14");
   if(ba.tocados>=14){ anota("Barcos",ba.tiros); ganar("🏆 ¡FLOTA HUNDIDA!","en "+ba.tiros+" tiros"); }
 },
 (x,y)=>{ const N=ba.N, S=60, ox=(W-N*S)/2, oy=(H-N*S)/2;
   const c=Math.floor((x-ox)/S), r=Math.floor((y-oy)/S);
   if(r<0||r>=N||c<0||c>=N||ba.v[r][c]) return;
   ba.tiros++;
   if(ba.g[r][c]){ ba.v[r][c]=1; ba.tocados++; } else ba.v[r][c]=2; });

// 3) TORRE DEFENSA simple
let td;
add("🏰","Defensa","Toca para poner torres · no dejes pasar enemigos",
 ()=>{ td={torres:[],enem:[],t:0,vidas:5,oro:3,pts:0}; },
 ()=>{ fondo("#102418"); const g=td; g.t++;
   // camino
   ctx.fillStyle="#3a2a1a"; ctx.fillRect(0,H/2-34,W,68);
   if(g.t%70===0) g.enem.push({x:-30,hp:3,v:1+g.pts*0.01});
   if(g.t%180===0) g.oro++;
   g.torres.forEach(t2=>{ texto("🏹",t2.x,t2.y,34);
     ctx.strokeStyle="rgba(95,224,160,.2)"; ctx.beginPath(); ctx.arc(t2.x,t2.y,90,0,7); ctx.stroke();
     if(g.t%26===0){ const e=g.enem.find(e2=>Math.hypot(e2.x-t2.x,H/2-t2.y)<90);
       if(e){ e.hp--; ctx.strokeStyle="#ffd12e"; ctx.lineWidth=2;
         ctx.beginPath(); ctx.moveTo(t2.x,t2.y); ctx.lineTo(e.x,H/2); ctx.stroke(); } } });
   for(let i=g.enem.length-1;i>=0;i--){ const e=g.enem[i]; e.x+=e.v;
     texto("👾",e.x,H/2,32);
     caja(e.x-16,H/2-30,32,5,"#333",null,2); caja(e.x-16,H/2-30,32*(e.hp/3),5,"#39ff14",null,2);
     if(e.hp<=0){ g.enem.splice(i,1); g.pts+=10; g.oro++; continue; }
     if(e.x>W){ g.enem.splice(i,1); g.vidas--;
       if(g.vidas<=0){ anota("Defensa",g.pts); ganar("💀 Te invadieron",g.pts+" puntos"); return; } } }
   info("❤️"+g.vidas+"  💰"+g.oro+"  ⭐"+g.pts);
 },
 (x,y)=>{ if(td.oro<3) return; if(Math.abs(y-H/2)<40) return;
   td.torres.push({x,y}); td.oro-=3; });

// 4) SNAKE CON OBSTÁCULOS
let so;
add("🐲","Serpiente+","Flechas · esquiva las piedras",
 ()=>{ const G=28, cols=(700/G)|0, rows=(560/G)|0;
   const ob=[]; for(let i=0;i<14;i++) ob.push({x:(Math.random()*cols)|0,y:(Math.random()*rows)|0});
   so={G,cols,rows,c:[{x:3,y:3}],d:{x:1,y:0},com:{x:12,y:8},ob,t:0,pts:0}; },
 ()=>{ const s=so; fondo("#0a1a14");
   if(++s.t%7===0){ const h={x:s.c[0].x+s.d.x,y:s.c[0].y+s.d.y};
     if(h.x<0||h.y<0||h.x>=s.cols||h.y>=s.rows||s.c.some(p=>p.x===h.x&&p.y===h.y)
       ||s.ob.some(p=>p.x===h.x&&p.y===h.y)){
       anota("Serpiente+",s.pts); ganar("💥 ¡Chocaste!",s.pts+" puntos"); return; }
     s.c.unshift(h);
     if(h.x===s.com.x&&h.y===s.com.y){ s.pts+=10;
       do{ s.com={x:(Math.random()*s.cols)|0,y:(Math.random()*s.rows)|0}; }
       while(s.ob.some(p=>p.x===s.com.x&&p.y===s.com.y)); }
     else s.c.pop(); }
   s.ob.forEach(p=>texto("🪨",p.x*s.G+s.G/2,p.y*s.G+s.G/2,s.G*0.8));
   texto("🍎",s.com.x*s.G+s.G/2,s.com.y*s.G+s.G/2,s.G*0.8);
   s.c.forEach((p,i)=>{ ctx.fillStyle=i?"#2a8f6a":"#5fe0a0"; ctx.fillRect(p.x*s.G+1,p.y*s.G+1,s.G-2,s.G-2); });
   info("⭐"+s.pts);
 }, null,
 (k)=>{ const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
   if(!m||(m[0]===-so.d.x&&m[1]===-so.d.y)) return; so.d={x:m[0],y:m[1]}; });

// 5) RECOGE LLAVES
let rl;
add("🔑","Llaves","Junta las 5 llaves y llega a la puerta 🚪",
 ()=>{ const N=13; const g=Array.from({length:N},()=>Array(N).fill(1));
   const pila=[[1,1]]; g[1][1]=0;
   while(pila.length){ const [r,c]=pila[pila.length-1];
     const v=[[r-2,c],[r+2,c],[r,c-2],[r,c+2]].filter(([a,b])=>a>0&&b>0&&a<N-1&&b<N-1&&g[a][b]===1);
     if(!v.length){ pila.pop(); continue; }
     const [nr,nc]=v[(Math.random()*v.length)|0]; g[nr][nc]=0; g[(r+nr)/2][(c+nc)/2]=0; pila.push([nr,nc]); }
   const libres=[]; for(let r=1;r<N-1;r++) for(let c=1;c<N-1;c++) if(!g[r][c]) libres.push([r,c]);
   const ll=[]; for(let i=0;i<5;i++){ const k=libres.splice((Math.random()*libres.length)|0,1)[0]; ll.push({r:k[0],c:k[1]}); }
   rl={g,N,p:{r:1,c:1},ll,tom:0}; },
 ()=>{ fondo("#0a1020"); const N=rl.N, S=Math.min((W-40)/N,(H-40)/N), ox=(W-N*S)/2, oy=(H-N*S)/2;
   for(let r=0;r<N;r++) for(let c=0;c<N;c++){ ctx.fillStyle=rl.g[r][c]?"#2a3a5a":"#0d1428";
     ctx.fillRect(ox+c*S,oy+r*S,S,S); }
   rl.ll.forEach(k=>texto("🔑",ox+k.c*S+S/2,oy+k.r*S+S/2,S*0.75));
   texto(rl.tom>=5?"🚪":"🔒",ox+(N-2)*S+S/2,oy+(N-2)*S+S/2,S*0.8);
   texto("🧑",ox+rl.p.c*S+S/2,oy+rl.p.r*S+S/2,S*0.8);
   info("🔑 "+rl.tom+"/5");
   if(rl.tom>=5 && rl.p.r===N-2 && rl.p.c===N-2){ anota("Llaves",5); ganar("🏆 ¡ESCAPASTE!",""); }
 }, null,
 (k)=>{ const m={arrowup:[-1,0],w:[-1,0],arrowdown:[1,0],s:[1,0],arrowleft:[0,-1],a:[0,-1],arrowright:[0,1],d:[0,1]}[k];
   if(!m) return; const nr=rl.p.r+m[0], nc=rl.p.c+m[1];
   if(rl.g[nr]&&rl.g[nr][nc]===0){ rl.p.r=nr; rl.p.c=nc;
     const i=rl.ll.findIndex(k2=>k2.r===nr&&k2.c===nc);
     if(i>=0){ rl.ll.splice(i,1); rl.tom++; } } });

// 6) EMPUJA CAJAS (sokoban)
let ec;
add("📦","Cajas","Empuja las cajas hasta los puntos 🎯",
 ()=>{ // nivel fijo sencillo
   const mapa=[
    "#########",
    "#       #",
    "# .$ $. #",
    "#   @   #",
    "# .$ $. #",
    "#       #",
    "#########"];
   const g=mapa.map(f=>f.split(""));
   let p={r:0,c:0};
   g.forEach((f,r)=>f.forEach((v,c)=>{ if(v==="@"){ p={r,c}; g[r][c]=" "; } }));
   ec={g,p,movs:0}; },
 ()=>{ const g=ec.g, R=g.length, C=g[0].length;
   fondo("#1a1408");
   const S=Math.min((W-40)/C,(H-60)/R), ox=(W-C*S)/2, oy=(H-R*S)/2;
   for(let r=0;r<R;r++) for(let c=0;c<C;c++){ const v=g[r][c];
     ctx.fillStyle = v==="#" ? "#5a4a28" : "#2a2416";
     ctx.fillRect(ox+c*S,oy+r*S,S,S);
     if(v==="."||v==="*") texto("🎯",ox+c*S+S/2,oy+r*S+S/2,S*0.6);
     if(v==="$"||v==="*") texto("📦",ox+c*S+S/2,oy+r*S+S/2,S*0.75); }
   texto("🧑",ox+ec.p.c*S+S/2,oy+ec.p.r*S+S/2,S*0.75);
   const faltan=g.flat().filter(v=>v==="$").length;
   info("faltan: "+faltan+"  movs: "+ec.movs);
   if(faltan===0){ anota("Cajas",ec.movs); ganar("🏆 ¡TODAS EN SU SITIO!","en "+ec.movs+" movimientos"); }
 }, null,
 (k)=>{ const m={arrowup:[-1,0],w:[-1,0],arrowdown:[1,0],s:[1,0],arrowleft:[0,-1],a:[0,-1],arrowright:[0,1],d:[0,1]}[k];
   if(!m) return; const g=ec.g, nr=ec.p.r+m[0], nc=ec.p.c+m[1];
   if(!g[nr]||g[nr][nc]==="#") return;
   if(g[nr][nc]==="$"||g[nr][nc]==="*"){
     const ar=nr+m[0], ac=nc+m[1];
     if(!g[ar]||g[ar][ac]==="#"||g[ar][ac]==="$"||g[ar][ac]==="*") return;
     g[ar][ac] = g[ar][ac]==="." ? "*" : "$";
     g[nr][nc] = g[nr][nc]==="*" ? "." : " "; }
   ec.p={r:nr,c:nc}; ec.movs++; });

// 7) PINTA EL MAPA
let pm;
add("🎨","Conquista","Pinta más casillas que la máquina",
 ()=>{ const N=12; pm={N,g:Array.from({length:N},()=>Array(N).fill(0)),
   p:{r:0,c:0},m:{r:N-1,c:N-1},t:0,fin:30*60}; pm.g[0][0]=1; pm.g[N-1][N-1]=2; },
 ()=>{ const N=pm.N; fondo("#0a1424"); pm.t++;
   const S=Math.min((W-40)/N,(H-70)/N), ox=(W-N*S)/2, oy=(H-N*S)/2+10;
   if(pm.t%8===0){
     if(teclas["arrowup"]||teclas["w"]) pm.p.r--;
     if(teclas["arrowdown"]||teclas["s"]) pm.p.r++;
     if(teclas["arrowleft"]||teclas["a"]) pm.p.c--;
     if(teclas["arrowright"]||teclas["d"]) pm.p.c++;
     pm.p.r=Math.max(0,Math.min(N-1,pm.p.r)); pm.p.c=Math.max(0,Math.min(N-1,pm.p.c));
     pm.g[pm.p.r][pm.p.c]=1;
     // máquina
     const d=[[0,1],[1,0],[0,-1],[-1,0]][(Math.random()*4)|0];
     pm.m.r=Math.max(0,Math.min(N-1,pm.m.r+d[0])); pm.m.c=Math.max(0,Math.min(N-1,pm.m.c+d[1]));
     pm.g[pm.m.r][pm.m.c]=2; }
   let n1=0,n2=0;
   for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const v=pm.g[r][c];
     ctx.fillStyle = v===1?"#5fe0a0" : v===2?"#ff5b6e" : "#152238";
     ctx.fillRect(ox+c*S+1,oy+r*S+1,S-2,S-2); if(v===1)n1++; if(v===2)n2++; }
   ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.strokeRect(ox+pm.p.c*S+2,oy+pm.p.r*S+2,S-4,S-4);
