<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Asteroides Neón</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;background:#02030a;color:#eaf6ff}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:100%;border-radius:12px;touch-action:none;
    box-shadow:0 0 28px rgba(0,204,255,.3),inset 0 0 40px rgba(0,204,255,.08)}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;
    font-weight:900;font-size:17px;pointer-events:none;text-shadow:0 0 8px #0cf}
  #hud span:nth-child(2){color:#ffd12e;text-shadow:0 0 8px #ffd12e}
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(2,3,10,.92);text-align:center;padding:20px}
  #menu h1{font-size:38px;letter-spacing:4px;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #0cf,0 0 40px #0cf}
  #menu p{margin:14px 0 22px;color:#7fc8e8;line-height:1.6;font-size:16px;max-width:460px}
  #menu button{cursor:pointer;padding:16px 42px;border-radius:14px;border:2px solid #0cf;background:rgba(0,0,0,.6);
    color:#fff;font-size:20px;font-weight:900;letter-spacing:2px;box-shadow:0 0 14px #0cf;text-shadow:0 0 8px #0cf}
  #menu button:hover{transform:scale(1.05)}
  #menu .stats{margin-top:18px;color:#ffd12e;font-weight:800;text-shadow:0 0 8px #ffd12e;line-height:1.7}
  #menu .teclas{margin-top:10px;color:#9aa;font-size:13px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="600" height="640"></canvas>
  <div id="hud"><span id="vidasT">♥♥♥</span><span id="puntos">0</span><span id="olaT">OLA 1</span></div>
  <div id="menu">
    <h1>ASTEROIDES NEÓN</h1>
    <p>Rompe las rocas antes que te choquen. Las grandes se parten en dos más chicas. Cada 10.000 puntos ganas una vida.</p>
    <button id="empezar">JUGAR</button>
    <div class="teclas">flechas ◄ ► para girar · ▲ para acelerar · ESPACIO para disparar · en el celular, botones en pantalla</div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const W=cv.width, H=cv.height, ZONA=H-80;   // abajo quedan los botones tactiles
const CLAVE="edtu_asteroides_mejor";
const TAM=[0,15,27,46], PTS=[0,100,50,20];

function leer(){ try{ return parseInt(localStorage.getItem(CLAVE)||"0",10)||0; }catch(e){ return 0; } }
function guardar(v){ try{ localStorage.setItem(CLAVE,String(v)); }catch(e){} }

let audio=null;
function tono(f,d,tipo,vol,subida){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(), g=audio.createGain(); o.type=tipo||"square"; const t=audio.currentTime;
  o.frequency.setValueAtTime(f,t); if(subida) o.frequency.exponentialRampToValueAtTime(f*subida,t+d);
  g.gain.setValueAtTime(vol||0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+d); }catch(e){} }

let nave, rocas=[], balas=[], partes=[], estrellas=[], puntos=0, vidas=3, ola=0, vivo=false, raf=null, sigVida=10000, enfriar=0, pausaOla=0, esperandoOtra=false;
const tecla={izq:false,der:false,arr:false,fuego:false};
for(let i=0;i<70;i++) estrellas.push({x:Math.random()*W,y:Math.random()*ZONA,r:Math.random()*1.4+0.3});

function nuevaNave(){ nave={x:W/2,y:ZONA/2,vx:0,vy:0,a:-Math.PI/2,inv:120}; }
function roca(x,y,t){
  const pts=[], n=10+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++) pts.push(0.72+Math.random()*0.38);
  const ang=Math.random()*Math.PI*2, v=(0.6+Math.random()*1.1)*(4-t)*0.55;
  return {x,y,t,r:TAM[t],vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,giro:(Math.random()-0.5)*0.04,a:0,pts};
}
function nuevaOla(){
  ola++; $("olaT").textContent="OLA "+ola;
  const n=Math.min(11,3+ola);
  for(let i=0;i<n;i++){
    let x,y; do{ x=Math.random()*W; y=Math.random()*ZONA; } while(Math.hypot(x-nave.x,y-nave.y)<170);
    rocas.push(roca(x,y,3));
  }
  [392,523,659].forEach((f,i)=>setTimeout(()=>tono(f,0.12,"triangle",0.06),i*90));
}
function empezar(){
  $("menu").style.display="none"; esperandoOtra=false;
  puntos=0; vidas=3; ola=0; sigVida=10000; rocas=[]; balas=[]; partes=[]; pausaOla=0;
  nuevaNave(); nuevaOla(); vivo=true; pintaHud();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(paso);
}
function pintaHud(){ $("vidasT").textContent="♥".repeat(Math.max(0,vidas)); $("puntos").textContent=puntos; }

function envolver(o){ if(o.x<0) o.x+=W; if(o.x>W) o.x-=W; if(o.y<0) o.y+=ZONA; if(o.y>ZONA) o.y-=ZONA; }

function explotar(x,y,n,col){ for(let i=0;i<n;i++){ const a=Math.random()*7, v=Math.random()*4+0.5; partes.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vida:30+Math.random()*20,col}); } }

function paso(){
  raf=requestAnimationFrame(paso);
  if(!vivo) return;
  // nave
  if(nave){
    if(tecla.izq) nave.a-=0.075; if(tecla.der) nave.a+=0.075;
    if(tecla.arr){ nave.vx+=Math.cos(nave.a)*0.16; nave.vy+=Math.sin(nave.a)*0.16;
      if(Math.random()<0.6) partes.push({x:nave.x-Math.cos(nave.a)*14,y:nave.y-Math.sin(nave.a)*14,vx:-Math.cos(nave.a)*2+(Math.random()-0.5),vy:-Math.sin(nave.a)*2+(Math.random()-0.5),vida:14,col:"#ffd12e"}); }
    nave.vx*=0.988; nave.vy*=0.988;
    const v=Math.hypot(nave.vx,nave.vy); if(v>7){ nave.vx*=7/v; nave.vy*=7/v; }
    nave.x+=nave.vx; nave.y+=nave.vy; envolver(nave);
    if(nave.inv>0) nave.inv--;
    enfriar--;
    if(tecla.fuego && enfriar<=0 && balas.length<8){
      balas.push({x:nave.x+Math.cos(nave.a)*16,y:nave.y+Math.sin(nave.a)*16,vx:Math.cos(nave.a)*9+nave.vx,vy:Math.sin(nave.a)*9+nave.vy,vida:58});
      enfriar=9; tono(880,0.05,"square",0.035,0.5);
    }
  }
  balas.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; envolver(b); b.vida--; });
  rocas.forEach(r=>{ r.x+=r.vx; r.y+=r.vy; r.a+=r.giro; envolver(r); });
  // balas contra rocas
  for(const b of balas){
    for(const r of rocas){
      if(r.muerta||b.vida<=0) continue;
      if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
        b.vida=0; r.muerta=true; puntos+=PTS[r.t];
        explotar(r.x,r.y,8+r.t*6,"#0cf");
        tono(200-r.t*40,0.18,"sawtooth",0.06,0.4);
        if(r.t>1) for(let k=0;k<2;k++) rocas.push(roca(r.x,r.y,r.t-1));
      }
    }
  }
  rocas=rocas.filter(r=>!r.muerta); balas=balas.filter(b=>b.vida>0);
  if(puntos>=sigVida){ vidas++; sigVida+=10000; tono(660,0.3,"sine",0.08,2); }
  // nave contra rocas
  if(nave && nave.inv<=0){
    for(const r of rocas){
      if(Math.hypot(nave.x-r.x,nave.y-r.y)<r.r+10){
        explotar(nave.x,nave.y,40,"#ff3b5c"); tono(90,0.6,"sawtooth",0.1,0.3);
        vidas--; nave=null;
        if(vidas<=0){ setTimeout(fin,1200); }
        else setTimeout(()=>{ if(vivo) nuevaNave(); },1100);
        break;
      }
    }
  }
  if(!rocas.length){ pausaOla++; if(pausaOla>70){ pausaOla=0; if(nave) nuevaOla(); } }
  partes.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.vy*=0.97; p.vida--; }); partes=partes.filter(p=>p.vida>0);
  pintaHud(); dibujar();
}

function fin(){
  vivo=false; cancelAnimationFrame(raf);
  const mejor=leer(), nuevo=puntos>mejor; if(nuevo) guardar(puntos);
  dibujar();
  ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.font="900 36px Segoe UI,sans-serif"; ctx.shadowColor="#0cf"; ctx.shadowBlur=18;
  ctx.fillText("NAVE DESTRUIDA",W/2,H/2-70); ctx.shadowBlur=0;
  ctx.fillStyle="#ffd12e"; ctx.font="800 26px Segoe UI,sans-serif"; ctx.fillText(puntos+" puntos · ola "+ola,W/2,H/2-20);
  ctx.fillStyle=nuevo?"#b6ff00":"#7fc8e8"; ctx.font="700 17px Segoe UI,sans-serif";
  ctx.fillText(nuevo?"¡NUEVO RÉCORD!":"Récord: "+leer(),W/2,H/2+18);
  ctx.fillStyle="#7fc8e8"; ctx.font="600 15px Segoe UI,sans-serif"; ctx.fillText("toca o aprieta ESPACIO para volver a jugar",W/2,H/2+60);
  setTimeout(()=>{ esperandoOtra=true; },700);
}

/* botones tactiles: ◄ ► ▲ y FUEGO */
const BOTONES=[
  {id:"izq", x:20, w:90, txt:"◄"},
  {id:"der", x:120,w:90, txt:"►"},
  {id:"arr", x:W-230,w:90, txt:"▲"},
  {id:"fuego",x:W-130,w:110,txt:"FUEGO"}
];
function dibujar(){
  ctx.fillStyle="#02030a"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.55)"; estrellas.forEach(s=>{ ctx.fillRect(s.x,s.y,s.r,s.r); });
  // rocas
  rocas.forEach(r=>{
    ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.a);
    ctx.strokeStyle="#0cf"; ctx.lineWidth=2; ctx.shadowColor="#0cf"; ctx.shadowBlur=12; ctx.fillStyle="rgba(0,204,255,.06)";
    ctx.beginPath(); r.pts.forEach((k,i)=>{ const a=i/r.pts.length*Math.PI*2; const px=Math.cos(a)*r.r*k, py=Math.sin(a)*r.r*k; i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  });
  ctx.shadowBlur=0;
  // balas
  ctx.fillStyle="#ffd12e"; ctx.shadowColor="#ffd12e"; ctx.shadowBlur=10;
  balas.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,2.6,0,7); ctx.fill(); });
  ctx.shadowBlur=0;
  // nave
  if(nave && !(nave.inv>0 && Math.floor(nave.inv/6)%2)){
    ctx.save(); ctx.translate(nave.x,nave.y); ctx.rotate(nave.a);
    ctx.strokeStyle="#ff3bd4"; ctx.lineWidth=2.5; ctx.shadowColor="#ff3bd4"; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-11,-10); ctx.lineTo(-6,0); ctx.lineTo(-11,10); ctx.closePath(); ctx.stroke();
    ctx.restore(); ctx.shadowBlur=0;
  }
  partes.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.vida/45); ctx.fillStyle=p.col; ctx.fillRect(p.x-1.5,p.y-1.5,3,3); });
  ctx.globalAlpha=1;
  // zona de botones
  ctx.fillStyle="#04060e"; ctx.fillRect(0,ZONA,W,H-ZONA);
  ctx.strokeStyle="rgba(0,204,255,.25)"; ctx.beginPath(); ctx.moveTo(0,ZONA); ctx.lineTo(W,ZONA); ctx.stroke();
  BOTONES.forEach(b=>{
    const on=tecla[b.id];
    ctx.fillStyle=on?"rgba(0,204,255,.25)":"rgba(255,255,255,.04)"; ctx.strokeStyle=b.id==="fuego"?"#ffd12e":"#0cf"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(b.x,ZONA+12,b.w,56,12) : ctx.rect(b.x,ZONA+12,b.w,56); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#eaf6ff"; ctx.font="900 20px Segoe UI,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(b.txt,b.x+b.w/2,ZONA+40);
  });
}

/* ---------- controles ---------- */
const MAPA={arrowleft:"izq",a:"izq",arrowright:"der",d:"der",arrowup:"arr",w:"arr"," ":"fuego"};
addEventListener("keydown",e=>{
  const k=MAPA[e.key.toLowerCase()];
  if(esperandoOtra && (e.key===" "||e.key==="Enter")){ e.preventDefault(); empezar(); return; }
  if(k){ e.preventDefault(); tecla[k]=true; }
});
addEventListener("keyup",e=>{ const k=MAPA[e.key.toLowerCase()]; if(k) tecla[k]=false; });

const dedos=new Map();   // cada dedo aprieta un boton
function botonEn(e){
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);
  if(y<ZONA) return null;
  const b=BOTONES.find(b=>x>=b.x&&x<=b.x+b.w); return b?b.id:null;
}
function recalcula(){ ["izq","der","arr","fuego"].forEach(k=>tecla[k]=false); dedos.forEach(id=>{ if(id) tecla[id]=true; }); }
cv.addEventListener("pointerdown",e=>{
  if(esperandoOtra){ empezar(); return; }
  dedos.set(e.pointerId,botonEn(e)); recalcula();
  try{ cv.setPointerCapture(e.pointerId); }catch(x){}
});
cv.addEventListener("pointermove",e=>{ if(dedos.has(e.pointerId)){ dedos.set(e.pointerId,botonEn(e)); recalcula(); } });
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,e=>{ dedos.delete(e.pointerId); recalcula(); }));
$("empezar").onclick=empezar;

$("stats").innerHTML="Récord de puntos: "+leer();
nuevaNave(); dibujar();

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
</script>
</body>
</html>
