<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDTU · Salón de Estilo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:
    radial-gradient(ellipse at 50% 0%,#ffd9ec,#ffc0e0 40%,#e89bd0);
    min-height:100vh;color:#5a2a48;overflow-x:hidden;user-select:none}
  .top{text-align:center;padding:14px}
  .top h1{font-size:24px;color:#c0397f;text-shadow:0 2px 0 #fff}
  .top p{font-size:13px;color:#9c4a7a}
  .stage{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;padding:10px 14px 30px;max-width:900px;margin:0 auto}
  /* la cara */
  .doll-wrap{background:#fff6fb;border:4px solid #ff9ecf;border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(192,57,127,.25)}
  svg.doll{display:block;width:280px;height:340px;max-width:82vw}
  /* paneles de opciones */
  .panels{display:flex;flex-direction:column;gap:12px;flex:1;min-width:260px;max-width:420px}
  .panel{background:#fff6fb;border:3px solid #ffb3da;border-radius:18px;padding:12px 14px}
  .panel h3{font-size:14px;color:#c0397f;margin-bottom:8px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .12s}
  .sw:hover,.sw:active{transform:scale(1.15)}
  .sw.on{border-color:#c0397f;box-shadow:0 0 0 2px #c0397f}
  .opt{display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:#ffe3f1;border:2px solid #ffb3da;
    border-radius:12px;padding:7px 12px;font-size:15px;font-weight:700;color:#a03a6e;transition:all .12s;margin:2px}
  .opt:hover{background:#ffd0e8}
  .opt.on{background:#ff8cc6;color:#fff;border-color:#c0397f}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .btn{font-size:15px;font-weight:800;cursor:pointer;border:none;border-radius:14px;padding:12px 20px;color:#fff;
    background:linear-gradient(90deg,#ff5ba8,#c0397f);box-shadow:0 4px 0 #9c2a62;transition:all .1s}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9c2a62}
  .btn.alt{background:linear-gradient(90deg,#7ec8ff,#4a9fe0);box-shadow:0 4px 0 #2a6fa0}
  .spark{position:fixed;pointer-events:none;font-size:22px;animation:rise 1s ease-out forwards;z-index:50}
  @keyframes rise{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-80px) scale(1.6)}}
  .msg{text-align:center;font-size:18px;font-weight:800;color:#c0397f;min-height:26px;margin:6px}
</style>
</head>
<body>
  <div class="top">
    <h1>💇‍♀️ Salón de Estilo EDTU 💅</h1>
    <p>Peina, maquilla y viste. ¡Crea tu look y guárdalo!</p>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stage">
    <div class="doll-wrap">
      <svg class="doll" id="doll" viewBox="0 0 280 340">
        <!-- pelo atrás -->
        <path id="hairBack" d="M60 150 Q50 320 90 330 L190 330 Q230 320 220 150 Q220 60 140 60 Q60 60 60 150Z" fill="#6b4423"/>
        <!-- cuello -->
        <rect x="122" y="180" width="36" height="50" rx="12" fill="#f2c9a8"/>
        <!-- ropa -->
        <path id="shirt" d="M80 230 Q140 210 200 230 L215 330 L65 330Z" fill="#ff8cc6"/>
        <!-- cara -->
        <ellipse id="face" cx="140" cy="140" rx="70" ry="80" fill="#f2c9a8"/>
        <!-- ojos -->
        <ellipse cx="116" cy="135" rx="11" ry="14" fill="#fff"/>
        <ellipse cx="164" cy="135" rx="11" ry="14" fill="#fff"/>
        <circle id="eyeL" cx="116" cy="137" r="7" fill="#5a3b1a"/>
        <circle id="eyeR" cx="164" cy="137" r="7" fill="#5a3b1a"/>
        <circle cx="118" cy="134" r="2.5" fill="#fff"/>
        <circle cx="166" cy="134" r="2.5" fill="#fff"/>
        <!-- pestañas -->
        <path d="M104 126 Q116 120 128 126" stroke="#3a2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M152 126 Q164 120 176 126" stroke="#3a2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- mejillas (blush) -->
        <ellipse id="blushL" cx="104" cy="160" rx="13" ry="9" fill="#ff9ebf" opacity="0"/>
        <ellipse id="blushR" cx="176" cy="160" rx="13" ry="9" fill="#ff9ebf" opacity="0"/>
        <!-- nariz -->
        <path d="M140 145 Q136 158 140 162" stroke="#d9a883" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- labios -->
        <path id="lips" d="M124 178 Q140 190 156 178 Q140 184 124 178Z" fill="#e0607f"/>
        <!-- pelo frente (flequillo) -->
        <path id="hairFront" d="M62 140 Q70 62 140 60 Q210 62 218 140 Q190 95 140 98 Q90 95 62 140Z" fill="#6b4423"/>
        <!-- accesorio -->
        <g id="accessory"></g>
      </svg>
    </div>

    <div class="panels">
      <div class="panel">
        <h3>💇 Color de pelo</h3>
        <div class="swatches" id="hairCols"></div>
      </div>
      <div class="panel">
        <h3>👚 Color de ropa</h3>
        <div class="swatches" id="shirtCols"></div>
      </div>
      <div class="panel">
        <h3>💄 Labios</h3>
        <div class="swatches" id="lipCols"></div>
      </div>
      <div class="panel">
        <h3>✨ Extras</h3>
        <div id="extras">
          <span class="opt" data-ex="blush">💗 Rubor</span>
          <span class="opt" data-ex="crown">👑 Corona</span>
          <span class="opt" data-ex="bow">🎀 Lazo</span>
          <span class="opt" data-ex="glasses">🕶️ Lentes</span>
          <span class="opt" data-ex="flower">🌸 Flor</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn alt" id="randomBtn">🎲 Sorpréndeme</button>
        <button class="btn" id="saveBtn">📸 ¡Guardar look!</button>
      </div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const estado={ extras:{} };

const hairColors=["#6b4423","#2a1a0e","#c9962e","#e8a0b8","#9b59b6","#e74c3c","#3498db","#1abc9c","#ffffff","#ff6fff"];
const shirtColors=["#ff8cc6","#7ec8ff","#9be37d","#ffd36e","#c58cff","#ff7a7a","#5ad1c8","#ffffff","#2c3e50","#ff4fa0"];
const lipColors=["#e0607f","#c0392b","#ff5ba8","#a0506e","#ff8c8c","#8e44ad","#6b2737","#ff3b6b"];

function mkSwatches(cont, cols, apply){
  cont.innerHTML="";
  cols.forEach((c,i)=>{
    const s=document.createElement("div"); s.className="sw"+(i===0?" on":"");
    s.style.background=c; cont.appendChild(s);
    s.onclick=()=>{ cont.querySelectorAll(".sw").forEach(x=>x.classList.remove("on")); s.classList.add("on"); apply(c); sparkle(s); };
  });
}
mkSwatches($("hairCols"),hairColors,c=>{ $("hairBack").setAttribute("fill",c); $("hairFront").setAttribute("fill",c); });
mkSwatches($("shirtCols"),shirtColors,c=>$("shirt").setAttribute("fill",c));
mkSwatches($("lipCols"),lipColors,c=>$("lips").setAttribute("fill",c));

// extras
document.querySelectorAll("#extras .opt").forEach(o=>{
  o.onclick=()=>{ const ex=o.dataset.ex; estado.extras[ex]=!estado.extras[ex];
    o.classList.toggle("on",estado.extras[ex]); pintaExtras(); sparkle(o); };
});
function pintaExtras(){
  $("blushL").setAttribute("opacity",estado.extras.blush?"0.75":"0");
  $("blushR").setAttribute("opacity",estado.extras.blush?"0.75":"0");
  let g="";
  if(estado.extras.crown) g+='<text x="140" y="70" font-size="52" text-anchor="middle">👑</text>';
  if(estado.extras.bow)   g+='<text x="196" y="100" font-size="36" text-anchor="middle">🎀</text>';
  if(estado.extras.glasses) g+='<text x="140" y="150" font-size="56" text-anchor="middle">🕶️</text>';
  if(estado.extras.flower) g+='<text x="86" y="104" font-size="34" text-anchor="middle">🌸</text>';
  $("accessory").innerHTML=g;
}

function sparkle(el){
  const r=el.getBoundingClientRect();
  for(let i=0;i<3;i++){ const s=document.createElement("div"); s.className="spark"; s.textContent=["✨","💖","⭐","🌟"][Math.floor(Math.random()*4)];
    s.style.left=(r.left+r.width/2+(Math.random()*30-15))+"px"; s.style.top=(r.top)+"px";
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}

$("randomBtn").onclick=()=>{
  const pick=(cont,cols)=>{ const i=Math.floor(Math.random()*cols.length); const sws=cont.querySelectorAll(".sw"); sws[i].click(); };
  pick($("hairCols"),hairColors); pick($("shirtCols"),shirtColors); pick($("lipCols"),lipColors);
  document.querySelectorAll("#extras .opt").forEach(o=>{ const want=Math.random()<0.4; if(want!==!!estado.extras[o.dataset.ex]) o.click(); });
  $("msg").textContent="🎲 ¡Mira este look!";
};

$("saveBtn").onclick=()=>{
  // guardar un "look creado" como récord (cuenta cuántos looks hiciste)
  try{ const n=(parseInt(localStorage.getItem("edtu_estilista_best")||"0",10)||0)+1;
    localStorage.setItem("edtu_estilista_best",String(n));
    if(window.parent&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("Salón de Estilo",n,n);
    $("msg").textContent="💖 ¡Look nº "+n+" guardado! ✨";
  }catch(e){ $("msg").textContent="💖 ¡Precioso look! ✨"; }
  for(let i=0;i<14;i++){ setTimeout(()=>{ const s=document.createElement("div"); s.className="spark";
    s.textContent=["✨","💖","🌟","💅","👑"][Math.floor(Math.random()*5)];
    s.style.left=(Math.random()*100)+"vw"; s.style.top=(30+Math.random()*50)+"vh"; s.style.fontSize=(20+Math.random()*20)+"px";
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }, i*60); }
};

/* 🖱️ Botones laterales del mouse: avisan a EDTU para volver atrás */
["mousedown","mouseup","auxclick"].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(e.button===3||e.button===4){ e.preventDefault(); e.stopPropagation();
      if(ev==="mouseup"&&e.button===3){ try{ window.parent.postMessage({edtuAtras:1},"*"); }catch(x){} } }
  }, true);
});
</script>
</body>
</html>
